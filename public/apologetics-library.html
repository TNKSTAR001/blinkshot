<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#20272b">
  <meta name="description" content="A searchable library of Christian apologetics questions and answers covering philosophy, history, science, and Scripture.">
  <title>Apologetics Library</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f2;
      --surface: #ffffff;
      --surface-soft: #eef3ef;
      --text: #20262d;
      --muted: #66717c;
      --line: #d8ded8;
      --line-strong: #bfc8bf;
      --accent: #b54f36;
      --accent-strong: #8f3624;
      --accent-soft: #f9e2d8;
      --accent-2: #1d7c68;
      --accent-2-soft: #d9efea;
      --scripture-bg: #f3f6e9;
      --scripture-border: #9daf6e;
      --shadow: 0 18px 38px rgba(28, 35, 38, 0.12);
      --radius: 12px;
      --radius-pill: 999px;
      --header: #20272b;
      --header-text: #ffffff;
      --focus: #d06b43;
      --font-serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    }

    [data-theme="night"] {
      color-scheme: dark;
      --bg: #111312;
      --surface: #1b1f1e;
      --surface-soft: #232927;
      --text: #eef2ed;
      --muted: #aab3ac;
      --line: #343c38;
      --line-strong: #4a554f;
      --accent: #f0b85a;
      --accent-strong: #ffd27e;
      --accent-soft: #3b2c1d;
      --accent-2: #63d3bd;
      --accent-2-soft: #173a34;
      --scripture-bg: #20291f;
      --scripture-border: #8aa06d;
      --shadow: 0 22px 42px rgba(0, 0, 0, 0.36);
      --header: #070807;
      --header-text: #f7fbf5;
      --focus: #f0b85a;
    }

    [data-theme="parchment"] {
      color-scheme: light;
      --bg: #f1eadc;
      --surface: #fffaf0;
      --surface-soft: #eadfc9;
      --text: #2f2920;
      --muted: #746a5d;
      --line: #d8cbb4;
      --line-strong: #bfae90;
      --accent: #8a4f2d;
      --accent-strong: #67351d;
      --accent-soft: #ead0b5;
      --accent-2: #3f6f5b;
      --accent-2-soft: #d4e2d3;
      --scripture-bg: #f7efd5;
      --scripture-border: #b89352;
      --shadow: 0 18px 36px rgba(65, 46, 23, 0.16);
      --header: #463626;
      --header-text: #fffaf0;
      --focus: #9a5b34;
    }

    [data-theme="contrast"] {
      color-scheme: dark;
      --bg: #000000;
      --surface: #101010;
      --surface-soft: #1f1f1f;
      --text: #ffffff;
      --muted: #d6d6d6;
      --line: #6b6b6b;
      --line-strong: #ffffff;
      --accent: #ffe15a;
      --accent-strong: #ffffff;
      --accent-soft: #3d3500;
      --accent-2: #69f0ff;
      --accent-2-soft: #003238;
      --scripture-bg: #101010;
      --scripture-border: #ffe15a;
      --shadow: none;
      --header: #000000;
      --header-text: #ffffff;
      --focus: #69f0ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      min-width: 320px;
      margin: 0;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--surface-soft) 34%, transparent), transparent 16rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body.detail-open {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: var(--accent-2);
      font-weight: 700;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }

    a:hover {
      color: var(--accent-strong);
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--header) 94%, transparent);
      color: var(--header-text);
      border-bottom: 1px solid color-mix(in srgb, var(--header-text) 16%, transparent);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(16px);
    }

    .header-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 14px 16px 12px;
    }

    .top-row,
    .mode-row,
    .result-meta,
    .card-meta,
    .detail-meta,
    .actions-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-row {
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: color-mix(in srgb, var(--header-text) 64%, transparent);
      font-size: 0.74rem;
      font-weight: 650;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.4rem;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .library-count {
      margin-top: 5px;
      color: color-mix(in srgb, var(--header-text) 76%, transparent);
      font-size: 0.88rem;
    }

    .utility-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .plain-button,
    .chip,
    .card-button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
    }

    .plain-button {
      padding: 0 11px;
      font-size: 0.9rem;
      font-weight: 750;
    }

    .plain-button:hover,
    .chip:hover,
    .card:hover {
      border-color: var(--accent);
    }

    .plain-button:active,
    .chip:active,
    .card-button:active,
    .card:active {
      transform: translateY(1px);
    }

    .header-button {
      border-color: color-mix(in srgb, var(--header-text) 26%, transparent);
      background: color-mix(in srgb, var(--header-text) 11%, transparent);
      color: var(--header-text);
    }

    .header-button:hover {
      border-color: color-mix(in srgb, var(--header-text) 55%, transparent);
      background: color-mix(in srgb, var(--header-text) 17%, transparent);
    }

    .search-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }

    .search-field {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      min-height: 48px;
      border: 1px solid color-mix(in srgb, var(--header-text) 24%, transparent);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--header-text) 12%, transparent);
      color: var(--header-text);
      overflow: hidden;
    }

    .search-label {
      padding-left: 13px;
      color: color-mix(in srgb, var(--header-text) 64%, transparent);
      font-size: 0.8rem;
      font-weight: 650;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    #search {
      min-width: 0;
      width: 100%;
      height: 46px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--header-text);
      padding: 0 10px;
    }

    #search::placeholder {
      color: color-mix(in srgb, var(--header-text) 62%, transparent);
    }

    .clear-search {
      display: none;
      min-width: 38px;
      height: 38px;
      margin-right: 4px;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--header-text);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 900;
    }

    .clear-search.visible {
      display: block;
    }

    .clear-search:hover {
      background: color-mix(in srgb, var(--header-text) 14%, transparent);
    }

    .mode-row {
      align-items: stretch;
      overflow-x: auto;
      padding-bottom: 1px;
      scrollbar-width: thin;
      mask-image: linear-gradient(90deg, transparent, black 14px, black calc(100% - 24px), transparent);
    }

    .theme-button {
      flex: 0 0 auto;
      min-width: 64px;
      min-height: 40px;
      padding: 7px 9px;
      border: 1px solid color-mix(in srgb, var(--header-text) 24%, transparent);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--header-text) 10%, transparent);
      color: color-mix(in srgb, var(--header-text) 85%, transparent);
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 650;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .theme-button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    [data-theme="night"] .theme-button.active,
    [data-theme="contrast"] .theme-button.active {
      color: #000000;
    }

    .filters {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 12px 16px 8px;
    }

    .filter-block {
      margin-bottom: 9px;
    }

    .filter-label {
      display: block;
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: thin;
      mask-image: linear-gradient(90deg, transparent, black 14px, black calc(100% - 24px), transparent);
    }

    .chip {
      flex: 0 0 auto;
      max-width: 220px;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--accent-2);
      border-color: var(--accent-2);
      color: #ffffff;
      box-shadow: 0 4px 10px color-mix(in srgb, var(--accent-2) 35%, transparent);
    }

    .chip-count {
      opacity: 0.7;
      font-size: 0.78em;
      font-weight: 700;
    }

    .app-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
    }

    .result-meta {
      justify-content: space-between;
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .result-title {
      color: var(--text);
      font-size: 1rem;
      font-weight: 750;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .card {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }

    .card:hover,
    .card:focus-visible {
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .card:focus-visible,
    .plain-button:focus-visible,
    .chip:focus-visible,
    .theme-button:focus-visible,
    #search:focus-visible,
    textarea:focus-visible,
    .clear-search:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .card-meta,
    .detail-meta {
      flex-wrap: wrap;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      max-width: 100%;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-weight: 700;
      line-height: 1.1;
    }

    .pill.alt {
      background: var(--accent-2-soft);
      color: var(--accent-2);
    }

    .card h2 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.06rem;
      line-height: 1.28;
      letter-spacing: 0;
    }

    .card-ref {
      margin: 8px 0 0;
      color: var(--accent-2);
      font-size: 0.92rem;
      font-weight: 750;
    }

    .card-excerpt {
      display: -webkit-box;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    mark {
      padding: 0 2px;
      border-radius: 3px;
      background: color-mix(in srgb, var(--accent) 28%, transparent);
      color: inherit;
    }

    .empty-state {
      padding: 42px 18px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }

    .detail-panel {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--surface);
      color: var(--text);
      transform: translateX(100%);
      transition: transform 0.22s ease;
    }

    .detail-panel.open {
      transform: translateX(0);
    }

    .detail-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 58px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .detail-scroll {
      min-height: 0;
      overflow: auto;
      padding: 18px 16px 28px;
    }

    .detail-inner {
      width: min(780px, 100%);
      margin: 0 auto;
    }

    .detail-title {
      margin: 8px 0 14px;
      font-family: var(--font-serif);
      font-size: 1.5rem;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .scripture {
      margin: 0 0 18px;
      padding: 14px;
      border-left: 5px solid var(--scripture-border);
      border-radius: var(--radius);
      background: var(--scripture-bg);
    }

    .scripture-ref {
      margin-bottom: 7px;
      color: var(--accent-strong);
      font-weight: 750;
    }

    .scripture blockquote {
      margin: 0;
      color: var(--text);
      font-family: var(--font-serif);
      font-size: 1.06rem;
      font-style: italic;
      line-height: 1.5;
    }

    .answer {
      overflow-wrap: anywhere;
    }

    .answer p:first-child,
    .answer ul:first-child,
    .answer ol:first-child {
      margin-top: 0;
    }

    .answer b,
    .answer strong {
      color: var(--text);
      font-weight: 700;
    }

    .answer ul,
    .answer ol {
      padding-left: 1.25rem;
    }

    .answer li {
      margin: 0.45rem 0;
    }

    .notes-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .notes-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-weight: 750;
    }

    .save-status {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 132px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface-soft);
      color: var(--text);
      padding: 11px;
      outline: 0;
    }

    .actions-row {
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .primary-action {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    [data-theme="night"] .primary-action,
    [data-theme="contrast"] .primary-action {
      color: #000000;
    }

    @media (min-width: 620px) {
      h1 {
        font-size: 1.65rem;
      }

      .search-grid {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 980px) {
      body.detail-open {
        overflow: auto;
      }

      .header-inner {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 0.75fr);
        gap: 18px;
        align-items: end;
        padding-top: 18px;
      }

      .top-row {
        margin-bottom: 0;
      }

      .filters {
        display: grid;
        grid-template-columns: 0.65fr 1fr;
        gap: 12px;
        align-items: start;
      }

      .app-shell {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(360px, 0.68fr);
        gap: 18px;
        align-items: start;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .detail-panel {
        position: sticky;
        top: 154px;
        z-index: 1;
        height: calc(100vh - 174px);
        min-height: 520px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        transform: none;
      }

      .detail-panel:not(.open) {
        display: grid;
      }

      .detail-panel.empty .detail-scroll,
      .detail-panel.empty .detail-toolbar {
        display: none;
      }

      .detail-panel.empty::before {
        content: "Select a question to view the full answer and notes.";
        display: grid;
        place-items: center;
        min-height: 520px;
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      .detail-toolbar {
        border-radius: var(--radius) var(--radius) 0 0;
      }

      .detail-scroll {
        padding: 20px;
      }

      .mobile-only {
        display: none;
      }
    }

    @media (max-width: 440px) {
      .top-row {
        align-items: flex-start;
      }

      .utility-buttons {
        flex-direction: column;
      }

      .header-button {
        width: 86px;
      }

      .library-count {
        max-width: 13rem;
      }

      .detail-title {
        font-size: 1.24rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="top-row">
        <div class="brand">
          <p class="eyebrow">Apologetics Reference</p>
          <h1>Apologetics Library</h1>
          <div class="library-count" id="libraryCount"></div>
        </div>
        <div class="utility-buttons">
          <button class="plain-button header-button" id="randomBtn" type="button">Random</button>
          <button class="plain-button header-button" id="fullscreenBtn" type="button">Fullscreen</button>
        </div>
      </div>

      <div class="search-grid">
        <label class="search-field">
          <span class="search-label">Search</span>
          <input id="search" type="search" autocomplete="off" placeholder="arguments, history, miracles, passages...">
          <button class="clear-search" id="clearSearch" type="button" aria-label="Clear search">X</button>
        </label>
        <div class="mode-row" id="themeButtons" aria-label="Color mode"></div>
      </div>
    </div>
  </header>

  <nav class="filters" aria-label="Library filters">
    <div class="filter-block">
      <span class="filter-label">Collections</span>
      <div class="chip-row" id="sourceFilters"></div>
    </div>
    <div class="filter-block">
      <span class="filter-label">Categories</span>
      <div class="chip-row" id="categoryFilters"></div>
    </div>
  </nav>

  <main class="app-shell">
    <section class="results-panel" aria-label="Questions">
      <div class="result-meta">
        <span class="result-title" id="resultTitle">Questions</span>
        <button class="plain-button" id="resetFilters" type="button">Reset</button>
      </div>
      <div class="cards" id="list"></div>
    </section>

    <aside class="detail-panel empty" id="detailPanel" aria-label="Selected answer" aria-live="polite">
      <div class="detail-toolbar">
        <button class="plain-button mobile-only" id="backBtn" type="button">Back</button>
        <button class="plain-button" id="copyLinkBtn" type="button">Copy Ref</button>
      </div>
      <div class="detail-scroll">
        <article class="detail-inner">
          <div class="detail-meta" id="detailMeta"></div>
          <h2 class="detail-title" id="detailTitle"></h2>
          <figure class="scripture">
            <figcaption class="scripture-ref" id="detailRef"></figcaption>
            <blockquote id="detailVerse"></blockquote>
          </figure>
          <div class="answer" id="detailAnswer"></div>
          <section class="notes-section" aria-label="Personal notes">
            <div class="notes-label">
              <span>Personal Notes</span>
              <span class="save-status" id="saveStatus"></span>
            </div>
            <textarea id="notesInput" placeholder="Add discussion points, cross references, or follow-up research."></textarea>
            <div class="actions-row">
              <button class="plain-button" id="clearNoteBtn" type="button">Clear</button>
              <button class="plain-button primary-action" id="saveNoteBtn" type="button">Save Notes</button>
            </div>
          </section>
        </article>
      </div>
    </aside>
  </main>

  <script>
    const entries = [
  {
    "id": "core-1-the-problem-of-evil-if-god-is-all-good-and-all-p",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 0,
    "legacyNoteKey": "apologetics_note_0",
    "cat": "Philosophy",
    "q": "The Problem of Evil: If God is all-good and all-powerful, why is there suffering?",
    "ref": "Romans 5:3-5",
    "verse": "Not only so, but we also glory in our sufferings, because we know that suffering produces perseverance; perseverance, character; and character, hope.",
    "a": "Philosopher Alvin Plantinga's 'Free Will Defense' logically demonstrates that a world containing genuinely free creatures is inherently more valuable than a world of automatons. If God forces people to do good, free will is violated. Historically, Christianity uniquely addresses this by asserting God did not remain distant from suffering; Christ entered human history to experience it and conquer it.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Neuroplasticity & Resilience:<\/b> John Hick's 'Soul-Making Theodicy' points out that moral virtues like courage, compassion, and self-sacrifice logically cannot exist in a frictionless, pain-free environment. Modern psychology echoes this: overcoming adversity physically rewires the brain for greater resilience.<\/li><li><b>The Megaphone of Pain:<\/b> C.S. Lewis famously argued in *The Problem of Pain* that 'God whispers to us in our pleasures... but shouts in our pains: it is His megaphone to rouse a deaf world.' Pain disrupts the illusion of human self-sufficiency.<\/li><li><b>Agape Love:<\/b> The highest form of love (agape) requires self-sacrifice. Without the possibility of physical or emotional danger, acts of heroic selflessness would be logically impossible, rendering humans morally stunted.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/existence-nature-of-god/the-problem-of-evil/' target='_blank'>The Problem of Evil (Reasonable Faith)<\/a><\/li><li><a href='https://www.str.org/w/the-problem-of-evil' target='_blank'>The Problem of Evil (Stand to Reason)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-2-divine-hiddenness-why-doesn-t-god-just-show-hims",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 1,
    "legacyNoteKey": "apologetics_note_1",
    "cat": "Philosophy",
    "q": "Divine Hiddenness: Why doesn't God just show Himself explicitly?",
    "ref": "Jeremiah 29:13",
    "verse": "You will seek me and find me when you seek me with all your heart.",
    "a": "J.L. Schellenberg's argument claims a loving God would make His existence obvious to all. However, Christian philosophers like Paul Moser argue for 'cognitive idolatry'—if God revealed Himself overwhelmingly, it would coerce obedience out of terror, destroying the possibility of a genuine, voluntary loving relationship.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Epistemic Distance:<\/b> Philosopher John Hick proposed that God maintains an 'epistemic distance'—a careful balance of evidence. God provides enough evidence (through cosmology, morality, and history) for those willing to seek Him, but leaves enough ambiguity so that those who do not want Him are not forced into submission.<\/li><li><b>Blaise Pascal's Insight:<\/b> Pascal noted, 'There is enough light for those who only desire to see, and enough obscurity for those who have a contrary disposition.' God seeks filial trust, not just forced intellectual assent.<\/li><li><b>The Exodus Example:<\/b> In the Old Testament, the Israelites witnessed undeniable, terrifying miracles (the plagues, the parting of the Red Sea), yet they rebelled weeks later. Explicit revelation does not guarantee a transformed heart.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/existence-nature-of-god/does-divine-hiddenness-justify-atheism' target='_blank'>Does Divine Hiddenness Justify Atheism? (Reasonable Faith)<\/a><\/li><li><a href='https://coldcasechristianity.com/writings/why-doesnt-god-make-himself-more-obvious-to-us/' target='_blank'>Why Doesn't God Make Himself More Obvious? (Cold-Case)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-3-hell-how-can-a-loving-god-send-people-to-eternal",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 2,
    "legacyNoteKey": "apologetics_note_2",
    "cat": "Philosophy",
    "q": "Hell: How can a loving God send people to eternal conscious torment?",
    "ref": "Romans 1:24",
    "verse": "Therefore God gave them over in the sinful desires of their hearts...",
    "a": "As C.S. Lewis famously stated, 'The doors of hell are locked on the inside.' Hell is not a torture chamber God gleefully sends people to; it is the ultimate culmination of a human soul consistently saying to God, 'Thy will be done' or God finally saying to the soul, 'Thy will be done.'<br><br><b>Expanded Evidence:<\/b><ul><li><b>The Dignity of Choice:<\/b> To force a creature who despises God into His holy, blazing presence for eternity would itself be a violation of their autonomy. Hell is the tragic but necessary result of God honoring human freedom to its absolute limit.<\/li><li><b>Infinite Debt:<\/b> From a perspective of absolute justice, the severity of a crime is tied to the majesty of the one sinned against. Since humans continuously rebel against an infinitely holy, eternal God, the moral debt incurred is inherently infinite, rendering eternal separation just.<\/li><li><b>A State of Being:<\/b> Orthodox theologians often view Hell not as arbitrary physical fire, but as the agonizing reality of being entirely severed from the Source of all joy, light, and love, a separation the soul ultimately chose for itself.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.str.org/w/is-hell-a-divine-torture-chamber-' target='_blank'>Is Hell a Divine Torture Chamber? (Stand to Reason)<\/a><\/li><li><a href='https://coldcasechristianity.com/writings/why-would-a-loving-god-send-anyone-to-hell/' target='_blank'>Why Would a Loving God Send Anyone to Hell? (Cold-Case)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-4-the-euthyphro-dilemma-is-something-good-because-",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 3,
    "legacyNoteKey": "apologetics_note_3",
    "cat": "Philosophy",
    "q": "The Euthyphro Dilemma: Is something good because God commands it, or does God command it because it's good?",
    "ref": "Psalm 119:137",
    "verse": "Righteous are you, Lord, and your laws are right.",
    "a": "This is a false dilemma. Apologists point to a third option: God's very nature is the objective standard of goodness. He does not arbitrarily invent moral rules (Divine Command Theory), nor does He bow to an external moral law above Himself.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Divine Simplicity:<\/b> Thomas Aquinas formulated that God *is* goodness itself. Goodness flows inherently from His immutable character of love, justice, and truth. Therefore, His commands are simply expressions of His perfect nature.<\/li><li><b>The Standard Meter:<\/b> Dr. William Lane Craig compares God to the standard meter bar in Paris. The bar isn't 'trying' to be a meter, nor did someone arbitrarily decide its length. It *is* the paradigm by which all other meters are measured. God is the paradigm of moral value.<\/li><li><b>Ontology vs. Epistemology:<\/b> We don't need to believe in God to *know* what is good (epistemology), but God must exist for objective goodness to actually *exist* as an anchor for reality (ontology).<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/question-answer/the-euthyphro-dilemma/' target='_blank'>The Euthyphro Dilemma (Reasonable Faith)<\/a><\/li><li><a href='https://www.str.org/w/euthyphro-s-dilemma' target='_blank'>Euthyphro's Dilemma (Stand to Reason)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-5-occam-s-razor-doesn-t-the-simplest-explanation-f",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 4,
    "legacyNoteKey": "apologetics_note_4",
    "cat": "Philosophy",
    "q": "Occam's Razor: Doesn't the simplest explanation favor atheism?",
    "ref": "Colossians 1:17",
    "verse": "He is before all things, and in him all things hold together.",
    "a": "Occam's Razor states we should not multiply entities beyond necessity. Philosopher Richard Swinburne argues that theism is actually the simplest explanation for a highly complex universe.<br><br><b>Expanded Evidence:<\/b><ul><li><b>The Ultimate Unifying Theory:<\/b> A purely materialistic worldview struggles to explain three massive realities: subjective consciousness, objective moral duties, and specified biological information. Theism acts as an elegant, simple 'unifying theory' that explains all three phenomena with a single Source (an infinite Mind).<\/li><li><b>The Multiverse Violation:<\/b> Atheistic cosmology often resorts to the 'Multiverse' to explain fine-tuning—postulating an infinite number of unobservable universes. This is the ultimate violation of Occam's Razor, multiplying theoretical entities to infinity to avoid one Creator.<\/li><li><b>Simplicity of Being:<\/b> Postulating one infinite, uncaused, non-physical Mind is infinitely simpler than postulating an infinite array of highly tuned, uncaused physical laws and constants that magically generate life.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/existence-nature-of-god/does-god-exist/' target='_blank'>Does God Exist? (Reasonable Faith)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-6-god-of-the-gaps-isn-t-god-just-an-excuse-for-wha",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 5,
    "legacyNoteKey": "apologetics_note_5",
    "cat": "Philosophy",
    "q": "God of the Gaps: Isn't God just an excuse for what science hasn't explained yet?",
    "ref": "Psalm 19:1",
    "verse": "The heavens declare the glory of God; the skies proclaim the work of his hands.",
    "a": "Christianity does not posit a 'gap' God. As mathematician Dr. John Lennox notes, 'God is not the God of the gaps, but the author of the whole show.'<br><br><b>Expanded Evidence:<\/b><ul><li><b>Agency vs. Mechanism:<\/b> When scientists discovered the mechanics of the Ford engine, they didn't conclude Henry Ford didn't exist. Understanding the mechanism of the universe increases admiration for the cosmic Architect; it doesn't replace Him.<\/li><li><b>Positive Evidence, Not Ignorance:<\/b> The Intelligent Design movement doesn't point to what we *don't* know, but what we *do* know. We know empirically that complex, specified information (like computer code) always comes from a mind. Finding digital code in DNA points logically to an intelligent agent based on positive scientific observation, not a gap in knowledge.<\/li><li><b>The Birth of Science:<\/b> Historically, giants like Francis Bacon, Johannes Kepler, and Isaac Newton birthed the scientific method precisely *because* they expected to find rational laws established by a rational Lawgiver.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.johnlennox.org/resources/133/god-of-the-gaps' target='_blank'>God of the Gaps (Dr. John Lennox)<\/a><\/li><li><a href='https://evolutionnews.org/2016/02/the_god_of_the_1/' target='_blank'>The God of the Gaps Objection (Evolution News)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-7-animal-suffering-why-was-there-millions-of-years",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 6,
    "legacyNoteKey": "apologetics_note_6",
    "cat": "Philosophy",
    "q": "Animal Suffering: Why was there millions of years of animal pain before humans sinned?",
    "ref": "Romans 8:20-21",
    "verse": "For the creation was subjected to frustration... in hope that the creation itself will be liberated from its bondage to decay.",
    "a": "Evolutionary creationists and Old Earth advocates argue that pain is a structural necessity for finite biological life to flourish and evolve in a physical environment. The 'groaning' of creation may be the temporary, necessary birthing pains of a universe designed to eventually house eternal beings.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Pain as Protection:<\/b> Michael Murray's work *Nature Red in Tooth and Claw* details how the biological capability for pain is a miraculous boundary system that prevents organisms from destroying themselves. Without nerve pain, animals would not survive.<\/li><li><b>Sentience vs. Sapience:<\/b> C.S. Lewis and modern philosophers differentiate between animal sentience (the neurological firing of pain) and human sapience (existential suffering, dreading the future, and psychological torment). Animals experience pain, but likely do not experience the complex existential suffering unique to humans.<\/li><li><b>Ecological Balance:<\/b> Predator-prey relationships, decay, and death are absolute necessities for maintaining ecological balance and energy transfer in a carbon-based, finite biosphere.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://biologos.org/articles/animal-pain-and-the-problem-of-evil' target='_blank'>Animal Pain and the Problem of Evil (BioLogos)<\/a><\/li><li><a href='https://www.reasonablefaith.org/writings/question-answer/animal-suffering/' target='_blank'>Animal Suffering (Reasonable Faith)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-8-free-will-vs-omniscience-if-god-knows-what-i-ll-",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 7,
    "legacyNoteKey": "apologetics_note_7",
    "cat": "Philosophy",
    "q": "Free Will vs. Omniscience: If God knows what I'll do, I have no free will.",
    "ref": "Psalm 139:4",
    "verse": "Before a word is on my tongue you, Lord, know it completely.",
    "a": "Knowledge does not equal causation. If you stand on a hill and watch two cars about to crash, your foreknowledge of the crash does not cause it to happen.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Outside of Time:<\/b> Boethius and Thomas Aquinas conceptualized God as existing entirely outside of the timeline. God doesn't 'look into the future'; He observes all of history—past, present, and future—in a single, eternal 'now'. He sees the choices you are freely making.<\/li><li><b>Molinism & Middle Knowledge:<\/b> This theological framework posits that God knows all potential choices (counterfactuals) free creatures would make in any hypothetical circumstance. He brilliantly weaves those completely free choices into a universe that ultimately achieves His providential plan.<\/li><li><b>Reflection, Not Generation:<\/b> Foreknowledge reflects reality; it does not generate it. A weather barometer perfectly predicts a storm, but it doesn't cause the storm. God's perfect knowledge is a reflection of your free actions.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/omniscence-and-free-will/molinism-vs.-calvinism/' target='_blank'>Molinism vs. Calvinism (Reasonable Faith)<\/a><\/li><li><a href='https://carm.org/doctrine-and-theology/if-god-knows-what-we-will-do-do-we-have-free-will/' target='_blank'>Do We Have Free Will if God is Omniscient? (CARM)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-9-the-argument-from-non-belief-if-god-wants-everyo",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 8,
    "legacyNoteKey": "apologetics_note_8",
    "cat": "Philosophy",
    "q": "The Argument from Non-Belief: If God wants everyone saved, why are there honest seekers who remain atheists?",
    "ref": "2 Peter 3:9",
    "verse": "The Lord is not slow in keeping his promise... Instead he is patient with you, not wanting anyone to perish, but everyone to come to repentance.",
    "a": "Theological frameworks vary, but many argue that humans are deeply self-deceived about the 'honesty' of their seeking (Jeremiah 17:9). If someone genuinely seeks truth, Christian theology promises God will reveal Himself in due time.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Volitional Readiness:<\/b> Philosopher Paul K. Moser argues that God is not interested in mere intellectual assent to His existence, but in filial, transformational trust. He calibrates His revelation perfectly to an individual's psychological and moral readiness to bow the knee.<\/li><li><b>The Heart's Reasons:<\/b> Blaise Pascal famously noted, 'The heart has its reasons which reason knows nothing of.' Much of human skepticism is rooted not in a lack of data, but in a subtle desire for absolute moral autonomy.<\/li><li><b>Progressive Revelation:<\/b> C.S. Lewis experienced years of honest seeking, transitioning from atheism to theism, and finally to Christianity. The fact that a seeker is currently an atheist does not mean God has abandoned them; their story isn't over yet.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/question-answer/the-problem-of-non-belief' target='_blank'>The Problem of Non-Belief (Reasonable Faith)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-10-unanswered-prayers-why-does-god-ignore-amputees-",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 9,
    "legacyNoteKey": "apologetics_note_9",
    "cat": "Philosophy",
    "q": "Unanswered Prayers: Why does God ignore amputees and human tragedies?",
    "ref": "2 Corinthians 12:9",
    "verse": "But he said to me, 'My grace is sufficient for you, for my power is made perfect in weakness.'",
    "a": "God is a Father, not a cosmic vending machine. Miracles, by definition, must be exceedingly rare to act as divine signs. God promises ultimate physical restoration in the bodily resurrection, not a friction-free existence in a fallen world.<br><br><b>Expanded Evidence:<\/b><ul><li><b>The Destruction of Natural Law:<\/b> C.S. Lewis noted in *Letters to Malcolm* that a world where every prayer was answered with an instantaneous miracle would be a world devoid of stable natural laws. If fire never burned the righteous and gravity never pulled down the innocent, rational action, science, and consequence would be impossible.<\/li><li><b>The Butterfly Effect:<\/b> Because reality is hyper-connected (Chaos Theory), altering one tragedy could indirectly cause a chain reaction resulting in a much worse catastrophe centuries later. An omniscient God sees the full tapestry.<\/li><li><b>Spiritual Maturity over Comfort:<\/b> The Apostle Paul begged God to remove his 'thorn in the flesh' (likely a physical ailment), but God declined, stating that grace is perfected in weakness. God prioritizes eternal character over temporary comfort.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.str.org/w/why-doesn-t-god-heal-amputees-' target='_blank'>Why Doesn't God Heal Amputees? (Stand to Reason)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-11-jesus-mythicism-did-jesus-even-exist",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 10,
    "legacyNoteKey": "apologetics_note_10",
    "cat": "History",
    "q": "Jesus Mythicism: Did Jesus even exist?",
    "ref": "2 Peter 1:16",
    "verse": "For we did not follow cleverly devised stories when we told you about the coming of our Lord Jesus Christ in power, but we were eyewitnesses of his majesty.",
    "a": "The idea that Jesus is a mythical construct is entirely rejected by the consensus of modern secular and critical historians. Jesus is one of the best-attested figures of antiquity.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Secular Hostile Sources:<\/b> Jesus' existence is independently attested by Roman historians (Tacitus, Pliny the Younger) and Jewish historians (Josephus, Mara bar Serapion). These were hostile witnesses with zero motive to invent a Christian savior.<\/li><li><b>Agnostic Consensus:<\/b> Even highly critical agnostic scholars like Bart Ehrman insist that the historical evidence for Jesus of Nazareth is overwhelmingly robust, calling mythicism a fringe internet conspiracy theory devoid of academic backing.<\/li><li><b>The Criterion of Multiple Attestation:<\/b> Historians look for independent streams of data. The life of Jesus is corroborated by Paul's letters, Mark's early source material, the 'Q' source, John's distinct tradition, and non-Christian records, providing a web of historical certainty.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.garyhabermas.com/' target='_blank'>Dr. Gary Habermas: Resurrection Research<\/a><\/li><li><a href='https://ehrmanblog.org/did-jesus-exist/' target='_blank'>Did Jesus Exist? (Bart Ehrman Blog)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-12-lack-of-secular-accounts-why-don-t-more-roman-hi",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 11,
    "legacyNoteKey": "apologetics_note_11",
    "cat": "History",
    "q": "Lack of Secular Accounts: Why don't more Roman historians mention Him?",
    "ref": "Acts 26:26",
    "verse": "The king is familiar with these things, and I can speak freely to him. I am convinced that none of this has escaped his notice, because it was not done in a corner.",
    "a": "Jesus was a peasant rabbi in a remote, backwater province of the Roman Empire, crucified as a state criminal. Expecting daily Roman newspaper coverage of His ministry is anachronistic.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Disproportionate Footprint:<\/b> Astonishingly, we have more secular historical sources mentioning Jesus within 150 years of His life (about 12) than we do for Tiberius Caesar (about 9), the reigning Roman Emperor at the time.<\/li><li><b>Tacitus' Confirmation:<\/b> The Roman historian Tacitus directly names 'Christus' as the founder of the Christian movement who suffered the extreme penalty under Pontius Pilate in Judea, perfectly corroborating the foundational Christian narrative.<\/li><li><b>Pliny's Letter:<\/b> Around 112 AD, the Roman governor Pliny the Younger wrote to Emperor Trajan detailing how Christians met on a specific day to sing hymns to Christ 'as to a god,' verifying the early, high Christology of the movement.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://coldcasechristianity.com/writings/is-there-any-evidence-for-jesus-outside-the-bible/' target='_blank'>Evidence for Jesus Outside the Bible (Cold-Case)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-13-resurrection-contradictions-the-gospels-can-t-ag",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 12,
    "legacyNoteKey": "apologetics_note_12",
    "cat": "History",
    "q": "Resurrection Contradictions: The Gospels can't agree on who went to the tomb.",
    "ref": "Proverbs 18:17",
    "verse": "In a lawsuit the first to speak seems right, until someone comes forward and cross-examines.",
    "a": "Historians and legal experts argue that minor variations in secondary details actually prove the accounts are authentic, uncolluded eyewitness testimonies.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Forensic Reliability:<\/b> J. Warner Wallace, a cold-case homicide detective, observes that in legal forensics, witness accounts that agree perfectly on every peripheral detail are immediately flagged as colluded fabrications. Reliable witnesses agree on the core event but vary on secondary details based on perspective.<\/li><li><b>The Criterion of Embarrassment:<\/b> All four Gospels report that women were the first to discover the empty tomb. In 1st-century Greco-Roman and Jewish cultures, women's testimony was not admissible in court. If the church fabricated the story, they would have made Peter or John the first witnesses.<\/li><li><b>Harmonization:<\/b> The variations (e.g., how many angels were seen, exactly which women arrived first) can easily be harmonized chronologically when reading the texts as complementary angles of a chaotic, multi-party morning event.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://coldcasechristianity.com/writings/how-to-respond-to-claims-that-the-gospels-contradict-one-another/' target='_blank'>Responding to Gospel Contradictions (Cold-Case)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-14-the-hallucination-theory-the-disciples-just-hall",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 13,
    "legacyNoteKey": "apologetics_note_13",
    "cat": "History",
    "q": "The Hallucination Theory: The disciples just hallucinated the risen Jesus.",
    "ref": "1 Corinthians 15:6",
    "verse": "After that, he appeared to more than five hundred of the brothers and sisters at the same time, most of whom are still living...",
    "a": "Psychologically, hallucinations are strictly individual, internal events, much like dreams. A collective, multi-sensory hallucination is scientifically impossible.<br><br><b>Expanded Evidence:<\/b><ul><li><b>No Mass Hallucinations:<\/b> There is no clinical psychological record of a 'mass hallucination' where multiple people see, hear, and interact with the exact same illusion simultaneously. The Gospels record Jesus appearing to groups, eating fish, and being touched.<\/li><li><b>Hostile Witnesses:<\/b> Hallucinations require an expectant, hopeful mindset. However, Jesus appeared to James (His skeptical half-brother) and Saul of Tarsus (a hostile persecutor of the church). Neither of them were psychologically primed to 'wish' Jesus back to life.<\/li><li><b>The Empty Tomb:<\/b> If the disciples were hallucinating in Jerusalem, the Jewish authorities could have easily crushed the movement by simply rolling the stone away and parading the rotting corpse through the streets. They couldn't, because the tomb was empty.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.garyhabermas.com/' target='_blank'>The Resurrection Evidence (Dr. Gary Habermas)<\/a><\/li><li><a href='https://coldcasechristianity.com/writings/why-the-resurrection-is-not-a-hallucination/' target='_blank'>Why It Wasn't a Hallucination (Cold-Case)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-15-the-swoon-theory-jesus-didn-t-die-he-just-passed",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 14,
    "legacyNoteKey": "apologetics_note_14",
    "cat": "History",
    "q": "The Swoon Theory: Jesus didn't die; He just passed out on the cross.",
    "ref": "John 19:34",
    "verse": "Instead, one of the soldiers pierced Jesus’ side with a spear, bringing a sudden flow of blood and water.",
    "a": "The Romans were professional executioners who faced the death penalty themselves if a victim escaped. The idea that Jesus survived a Roman crucifixion is medically absurd.<br><br><b>Expanded Evidence:<\/b><ul><li><b>JAMA Medical Verdict:<\/b> A peer-reviewed article in the *Journal of the American Medical Association* (1986) concluded conclusively that the scourging, hypovolemic shock, crucifixion, and the spear thrust into the heart cavity (releasing separated blood and pericardial fluid) guaranteed Jesus' biological death.<\/li><li><b>The Flagrum:<\/b> Roman scourging utilized a whip embedded with metal and bone, designed to flay flesh and expose veins and entrails. Victims often died from the scourging alone before reaching the cross.<\/li><li><b>The Absurdity of the Swoon:<\/b> Even if Jesus miraculously survived, a half-dead, profusely bleeding, crippled man staggering out of a sealed tomb would have elicited pity from the disciples, not the earth-shattering worship of a glorified, death-conquering Lord of Life.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/jesus-of-nazareth/the-resurrection-of-jesus/' target='_blank'>The Resurrection of Jesus (Reasonable Faith)<\/a><\/li><li><a href='https://carm.org/about-jesus/did-jesus-swoon-on-the-cross/' target='_blank'>Did Jesus Swoon on the Cross? (CARM)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-16-the-stolen-body-hypothesis-the-disciples-stole-t",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 15,
    "legacyNoteKey": "apologetics_note_15",
    "cat": "History",
    "q": "The Stolen Body Hypothesis: The disciples stole the body to fake the resurrection.",
    "ref": "Matthew 28:13",
    "verse": "You are to say, 'His disciples came during the night and stole him away while we were asleep.'",
    "a": "People will die for a lie they *believe* is true, but nobody willingly dies for a lie they *know* they invented.<br><br><b>Expanded Evidence:<\/b><ul><li><b>The Martyrdom Test:<\/b> The disciples were tortured, exiled, and executed for their claim that they saw the risen Christ. If they stole the body, they knowingly subjected themselves to brutal deaths for a known hoax.<\/li><li><b>The Watergate Comparison:<\/b> Charles Colson, convicted in the Watergate scandal, noted that the most powerful men in America couldn't hold a lie together for two weeks to save their own skins. Yet the obscure, uneducated disciples endured decades of torture without one ever breaking rank and confessing a hoax.<\/li><li><b>The Enemy Attestation:<\/b> The earliest Jewish polemic against Christianity (found in Matthew 28 and later writings) was the claim that the disciples stole the body. This is a massive historical concession: the enemies of Christianity admitted the tomb was empty.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://coldcasechristianity.com/writings/is-the-stolen-body-hypothesis-a-reasonable-explanation-for-the-resurrection/' target='_blank'>Is the Stolen Body Hypothesis Reasonable? (Cold-Case)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-17-pagan-copycat-theory-jesus-is-just-a-copy-of-hor",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 16,
    "legacyNoteKey": "apologetics_note_16",
    "cat": "History",
    "q": "Pagan Copycat Theory: Jesus is just a copy of Horus, Mithras, or Osiris.",
    "ref": "1 John 1:1",
    "verse": "That which was from the beginning, which we have heard, which we have seen with our eyes... this we proclaim concerning the Word of life.",
    "a": "Popularized by internet movies like *Zeitgeist*, this claim is universally dismissed by academic historians as completely unfounded.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Textual Fabrication:<\/b> When reading primary Egyptian texts, Horus was not crucified or resurrected. Osiris was chopped into pieces and reassembled in the underworld, not bodily resurrected. Mithras was supposedly born out of a solid rock, not a virgin. The internet claims simply fabricate data.<\/li><li><b>Chronological Reversal:<\/b> The mystery religion iterations that bear any slight resemblance to Christianity heavily post-date the 1st century. This suggests pagan cults actually borrowed elements from a rapidly growing Christianity to stay relevant, not the reverse.<\/li><li><b>Jewish Exclusivity:<\/b> Early Christianity was birthed out of 1st-century Second Temple Judaism, a culture that vehemently hated and actively rejected pagan syncretism. They would never invent a savior based on Egyptian myths.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.str.org/w/is-jesus-a-copycat-savior-' target='_blank'>Is Jesus a Copycat Savior? (Stand to Reason)<\/a><\/li><li><a href='https://coldcasechristianity.com/writings/is-jesus-simply-a-retelling-of-the-mithras-mythology/' target='_blank'>Is Jesus a Retelling of Mithras? (Cold-Case)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-18-council-of-nicaea-didn-t-constantine-invent-jesu",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 17,
    "legacyNoteKey": "apologetics_note_17",
    "cat": "History",
    "q": "Council of Nicaea: Didn't Constantine invent Jesus' divinity in 325 AD?",
    "ref": "Philippians 2:5-6",
    "verse": "Christ Jesus: Who, being in very nature God, did not consider equality with God something to be used to his own advantage.",
    "a": "Absolutely not. The Council of Nicaea was convened to settle the Arian controversy, but early Christians worshipped Jesus as God centuries prior to Constantine.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Pre-Nicene Worship:<\/b> Pliny the Younger wrote in 112 AD that Christians sang hymns to Christ 'as to a god.' Church Fathers like Ignatius of Antioch (110 AD) explicitly called Jesus 'our God.'<\/li><li><b>The Carmen Christi:<\/b> Philippians 2:5-11, known as the 'Carmen Christi' hymn, dates to within 20 years of the crucifixion and explicitly declares Jesus' pre-existence and equality with God.<\/li><li><b>The Arian Heresy:<\/b> Nicaea did not invent the Trinity; it formalized the theological vocabulary (using terms like *homoousios*—of the same substance) to counter Arius, who was teaching that Jesus was a created being. The council was defending established tradition, not inventing a new one.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://carm.org/doctrine-and-theology/did-constantine-invent-the-trinity/' target='_blank'>Did Constantine Invent the Trinity? (CARM)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-19-constantine-s-politics-christianity-was-just-a-p",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 18,
    "legacyNoteKey": "apologetics_note_18",
    "cat": "History",
    "q": "Constantine's Politics: Christianity was just a political tool for the Roman Empire.",
    "ref": "John 18:36",
    "verse": "Jesus said, 'My kingdom is not of this world. If it were, my servants would fight to prevent my arrest...'",
    "a": "Constantine did not make Christianity the official religion of Rome; Emperor Theodosius did in 380 AD. Constantine merely legalized it.<br><br><b>Expanded Evidence:<\/b><ul><li><b>The Edict of Milan:<\/b> In 313 AD, Constantine issued the Edict of Milan, which simply stopped 300 years of brutal state persecution (including the horrific Diocletianic Persecution just a decade prior). It allowed religious tolerance.<\/li><li><b>Bottom-Up Growth:<\/b> Sociologist Rodney Stark estimates that Christianity grew organically at a rate of 40% per decade prior to Constantine. It was already becoming the dominant social force. Constantine adopted an already thriving, unstoppable movement.<\/li><li><b>Martyrdom over Power:<\/b> For its first three centuries, Christianity conquered the empire socially from the bottom up, through charity, plague-care, and the blood of martyrs, without ever drawing a sword or holding political office.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.str.org/w/did-constantine-invent-christianity-' target='_blank'>Did Constantine Invent Christianity? (Stand to Reason)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-20-failed-apocalyptic-prophet-jesus-was-just-a-rebe",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 19,
    "legacyNoteKey": "apologetics_note_19",
    "cat": "History",
    "q": "Failed Apocalyptic Prophet: Jesus was just a rebel who got crushed by Rome.",
    "ref": "Acts 5:38-39",
    "verse": "If their purpose or activity is of human origin, it will fail. But if it is from God, you will not be able to stop these men...",
    "a": "First-century Judea was filled with apocalyptic messiah claimants. When these men were killed by Rome, their movements instantly died. The Jesus movement is the singular historical anomaly.<br><br><b>Expanded Evidence:<\/b><ul><li><b>The Jewish Template:<\/b> N.T. Wright notes in *The Resurrection of the Son of God* that if a 1st-century Jewish messiah was crucified, his followers had only two culturally acceptable choices: give up and go home, or find a new messiah (usually the deceased's brother).<\/li><li><b>The Bar Kokhba Contrast:<\/b> In 132 AD, Simon bar Kokhba led a massive revolt and was heralded as the Messiah. When Rome crushed him, his movement vanished. None of his followers claimed he resurrected.<\/li><li><b>Unprecedented Theology:<\/b> Proclaiming that a crucified man had been bodily resurrected in the middle of history was completely unprecedented and scandalous in Jewish theology. It demands a massive, objective historical catalyst to explain the origin of the belief.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/jesus-of-nazareth/the-resurrection-of-jesus/' target='_blank'>The Resurrection of Jesus (Reasonable Faith)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-21-evolution-doesn-t-biological-evolution-disprove-",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 20,
    "legacyNoteKey": "apologetics_note_20",
    "cat": "Science",
    "q": "Evolution: Doesn't biological evolution disprove the Genesis creation account?",
    "ref": "Genesis 1:27",
    "verse": "So God created mankind in his own image, in the image of God he created them; male and female he created them.",
    "a": "Many orthodox theologians argue that Genesis 1 is ancient Near Eastern literature focused on assigning functional 'cosmic temple' roles, not detailing material, scientific origins.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Evolutionary Creationism:<\/b> Prominent Christian scientists (like Dr. Francis Collins, former head of the Human Genome Project) support Evolutionary Creationism, arguing evolution is simply the elegant mechanism God used to unfold life. The theological core—that humanity is purposefully made in God's image—remains fully intact.<\/li><li><b>The Cambrian Explosion:<\/b> For those who reject macro-evolution, the 'Cambrian Explosion' serves as a massive fossil anomaly. The majority of major animal body plans appear suddenly in the geological record without clear transitional evolutionary precursors, strongly pointing toward intelligent design events.<\/li><li><b>Teleological Convergence:<\/b> Paleontologist Simon Conway Morris highlights 'evolutionary convergence'—the idea that evolution repeatedly arrives at similar complex structures (like the camera eye). This suggests evolution is not blind, but 'front-loaded' and constrained by a Designer to reach specific destinations.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.discovery.org/id/' target='_blank'>Intelligent Design (Discovery Institute)<\/a><\/li><li><a href='https://biologos.org/' target='_blank'>Evolutionary Creation (BioLogos)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-22-the-big-bang-the-universe-started-naturally-with",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 21,
    "legacyNoteKey": "apologetics_note_21",
    "cat": "Science",
    "q": "The Big Bang: The universe started naturally, without God.",
    "ref": "Hebrews 11:3",
    "verse": "By faith we understand that the universe was formed at God’s command, so that what is seen was not made out of what was visible.",
    "a": "Historically, the Big Bang theory was first proposed by Georges Lemaître, a Catholic priest and physicist. The theory actually validates the biblical claim that the universe had a definitive beginning out of nothing (*creatio ex nihilo*).<br><br><b>Expanded Evidence:<\/b><ul><li><b>The Death of the Steady State:<\/b> Before the Big Bang model, atheistic scientists favored the 'Steady State' theory—an eternal universe with no beginning, avoiding the need for a Creator. The discovery of galactic redshift (Hubble) proved the universe is expanding from a singular point of origin, deeply unsettling materialist paradigms.<\/li><li><b>The BGV Theorem:<\/b> The Borde-Guth-Vilenkin Theorem mathematically demonstrates that any universe expanding on average throughout its history cannot be infinite in the past. It must have an absolute space-time boundary (a beginning).<\/li><li><b>Beyond Physics:<\/b> If time, space, and matter all began at the Big Bang, the Cause of the Big Bang must necessarily be timeless, spaceless, and immaterial. This perfectly describes the God of the Bible.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/existence-nature-of-god/the-kalam-cosmological-argument/' target='_blank'>The Kalam Cosmological Argument (Reasonable Faith)<\/a><\/li><li><a href='https://reasons.org/explore/publications/articles/the-big-bang-the-bible-and-the-beginning-of-time' target='_blank'>The Big Bang and the Bible (Reasons to Believe)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-23-the-multiverse-doesn-t-a-multiverse-explain-away",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 22,
    "legacyNoteKey": "apologetics_note_22",
    "cat": "Science",
    "q": "The Multiverse: Doesn't a multiverse explain away the fine-tuning of our universe?",
    "ref": "Isaiah 45:18",
    "verse": "He who fashioned and made the earth... he did not create it to be empty, but formed it to be inhabited.",
    "a": "Postulating an infinite number of unobservable universes to explain our highly tuned one commits the 'gambler's fallacy' and moves science away from empirical observation and into pure metaphysics.<br><br><b>Expanded Evidence:<\/b><ul><li><b>The Boltzmann Brain Problem:<\/b> Physicists note that if the multiverse generates universes randomly, it is vastly more mathematically probable for a random fluctuation to produce a single, disembodied 'brain' hallucinating a universe for a millisecond than it is to produce a 13.8 billion-year-old, hyper-structured cosmos. Multiverse theory undermines human rationality itself.<\/li><li><b>The Generator Requires Design:<\/b> Even if a 'universe generator' existed to pump out multiple universes, that mechanism itself would require incredibly precise fine-tuning to operate, merely pushing the need for a Designer one step back.<\/li><li><b>Infinite Past Impossible:<\/b> As proven by the BGV theorem, even a multiverse cannot be eternal in the past; the multiverse itself would still require an absolute beginning.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/question-answer/multiverse-and-the-design-argument' target='_blank'>The Multiverse and the Design Argument (Reasonable Faith)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-24-neuroscience-doesn-t-the-brain-prove-the-soul-is",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 23,
    "legacyNoteKey": "apologetics_note_23",
    "cat": "Science",
    "q": "Neuroscience: Doesn't the brain prove the 'soul' is just chemical reactions?",
    "ref": "Matthew 10:28",
    "verse": "Do not be afraid of those who kill the body but cannot kill the soul.",
    "a": "While physicalism argues consciousness is an illusion generated by biology, 'Emergent Dualism' points out that subjective, first-person experiences (the feeling of pain, the redness of red) cannot be reduced to third-person physical brain states.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Atheist Defectors:<\/b> Prominent atheist philosopher Thomas Nagel wrote *Mind and Cosmos*, arguing that strict Darwinian materialism fundamentally fails to explain the existence of consciousness and objective reasoning.<\/li><li><b>Near-Death Experiences (NDEs):<\/b> Clinical studies, such as the AWARE study conducted by Dr. Sam Parnia, report instances where patients with flatlined brain activity and no blood flow accurately recount veridical (verifiable) visual details of their operating rooms from a ceiling-level perspective, defying purely biological explanations of the mind.<\/li><li><b>The Hard Problem of Consciousness:<\/b> As coined by David Chalmers, science can map neural pathways (the 'easy' problem), but chemistry and physics possess no mechanism to explain how firing synapses magically generate an inner, subjective observer.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.str.org/w/is-the-soul-real-' target='_blank'>Is the Soul Real? (Stand to Reason)<\/a><\/li><li><a href='https://coldcasechristianity.com/writings/is-there-a-difference-between-the-brain-and-the-mind/' target='_blank'>Brain vs. Mind (Cold-Case)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-25-age-of-the-earth-science-says-13-8-billion-years",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 24,
    "legacyNoteKey": "apologetics_note_24",
    "cat": "Science",
    "q": "Age of the Earth: Science says 13.8 billion years, the Bible says 6,000.",
    "ref": "Exodus 20:11",
    "verse": "For in six days the Lord made the heavens and the earth, the sea, and all that is in them, but he rested on the seventh day.",
    "a": "Young Earth Creationism (YEC) asserts that the historical and genealogical records in Genesis are literal, placing the universe's age at roughly 6,000 years. YEC scientists argue that mainstream dating methods rely on unprovable uniformitarian assumptions—assuming decay rates and starting conditions have remained constant throughout history, which a global catastrophe like the Flood would completely disrupt.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Soft Tissue in Dinosaur Bones:<\/b> Paleontologists have repeatedly discovered un-fossilized soft tissue, blood vessels, and intact proteins (like collagen) in dinosaur bones (such as a T-Rex). Because biological tissue degrades rapidly, these findings strongly suggest these fossils are only thousands, not millions, of years old.<\/li><li><b>Radiocarbon in Diamonds:<\/b> Carbon-14 has a short half-life of 5,730 years and should be completely undetectable after 100,000 years. Yet, measurable amounts of C-14 are consistently found in coal seams and diamonds, which secular geology dates as hundreds of millions of years old, pointing instead to a young earth.<\/li><li><b>Magnetic Field Decay:<\/b> The Earth's magnetic field is rapidly decaying. Extrapolating this decay rate backward indicates that just a few tens of thousands of years ago, the field would have been so strong it would have melted the Earth, placing a strict upper limit on the planet's age.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://answersingenesis.org/age-of-the-earth/' target='_blank'>Evidence for a Young Earth (Answers in Genesis)<\/a><\/li><li><a href='https://creation.com/age-of-the-earth' target='_blank'>101 Evidences for a Young Age (Creation Ministries International)<\/a><\/li><li><a href='https://www.icr.org/creation-age/' target='_blank'>Age of the Earth (Institute for Creation Research)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-26-noah-s-flood-there-is-no-geological-evidence-for",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 25,
    "legacyNoteKey": "apologetics_note_25",
    "cat": "Science",
    "q": "Noah's Flood: There is no geological evidence for a global flood.",
    "ref": "2 Peter 2:5",
    "verse": "If he did not spare the ancient world when he brought the flood on its ungodly people, but protected Noah...",
    "a": "Genesis 6-9 refers to the destruction of 'all flesh' 13 times. A massive ark would be logically unnecessary for a localized flood where animals and humans could simply migrate over a mountain ridge to escape. Geologically, the earth is covered in fossil-laden sedimentary rock layers deposited by massive, fast-moving water.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Megasequences across Continents:<\/b> Geologists have mapped massive sedimentary rock layers (like the Sauk and Tippecanoe sequences) that span continuously across North America, into Europe, and even North Africa. This is entirely consistent with a single, global marine catastrophe rather than isolated local floods.<\/li><li><b>Polystrate Fossils & Rapid Burial:<\/b> We find tree trunks standing vertically through multiple geological layers. If layers took millions of years to form, the tops of the trees would rot away. They demonstrate rapid, catastrophic deposition. Additionally, millions of marine fossils are found clustered on the tops of the world's highest mountain ranges (including the Himalayas).<\/li><li><b>Folded Rock Layers:<\/b> Massive mountainous rock layers are found bent and folded tightly without fracturing. Solid rock snaps when bent. This proves the sedimentary layers were still wet, pliable, and unlithified when continental uplift occurred, pointing to a massive, rapid, water-based cataclysm.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://answersingenesis.org/the-flood/flood-evidence/' target='_blank'>A Flood of Evidence (Answers in Genesis)<\/a><\/li><li><a href='https://answersingenesis.org/the-flood/global/prosecution-extent-of-the-flood/' target='_blank'>Prosecution—Extent of the Flood<\/a><\/li><\/ul>"
  },
  {
    "id": "core-27-anthropic-principle-the-universe-just-looks-desi",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 26,
    "legacyNoteKey": "apologetics_note_26",
    "cat": "Science",
    "q": "Anthropic Principle: The universe just looks designed because we are here to observe it.",
    "ref": "Job 38:4",
    "verse": "Where were you when I laid the earth’s foundation? Tell me, if you understand.",
    "a": "Philosopher John Leslie counters this with the 'Firing Squad' analogy: If 50 trained marksmen fire at you from close range and all miss, you wouldn't say, 'Well, if they hadn't missed, I wouldn't be here to observe it!' You would logically conclude the miss was coordinated by deliberate design.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Astronomical Odds:<\/b> Sir Roger Penrose calculated the odds of the universe's initial low-entropy state occurring by chance to be 1 in 10<sup>10<sup>123<\/sup><\/sup>. This number is so small that writing a zero on every proton in the universe wouldn't be enough ink to write it out.<\/li><li><b>The Carbon Resonance:<\/b> Atheist astrophysicist Sir Fred Hoyle discovered the precise resonance level of carbon-12, a requirement for life. It was so perfectly balanced he abandoned his atheism, stating that a 'superintellect has monkeyed with physics, as well as with chemistry and biology.'<\/li><li><b>Cosmological Constant:<\/b> The expansion rate of the universe is fine-tuned to 1 part in 10<sup>120<\/sup>. If it were slightly faster, galaxies would never form. Slightly slower, the universe collapses into a black hole.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/existence-nature-of-god/the-teleological-argument/' target='_blank'>The Teleological Argument (Reasonable Faith)<\/a><\/li><li><a href='https://www.discovery.org/id/fine-tuning/' target='_blank'>Cosmic Fine-Tuning (Discovery Institute)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-28-laws-of-thermodynamics-how-does-this-point-to-go",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 27,
    "legacyNoteKey": "apologetics_note_27",
    "cat": "Science",
    "q": "Laws of Thermodynamics: How does this point to God?",
    "ref": "Psalm 102:25-26",
    "verse": "In the beginning you laid the foundations of the earth... They will perish, but you remain; they will all wear out like a garment.",
    "a": "The Second Law of Thermodynamics states that the universe is continually increasing in entropy (running out of usable energy). If the universe were eternal in the past, it would have already reached maximum entropy (heat death) an eternity ago.<br><br><b>Expanded Evidence:<\/b><ul><li><b>The Cosmological Argument:<\/b> Because we still have usable energy (stars are still burning), the universe cannot be infinitely old. It must have been 'wound up' at a definitive starting point. The Kalam Cosmological Argument dictates that whatever begins to exist requires a cause.<\/li><li><b>No Perpetual Motion:<\/b> Physics dictates that perpetual motion machines are impossible in a closed system. The universe is a closed system that is winding down, proving it is not a self-sustaining, eternal entity.<\/li><li><b>A Transcendent Winder:<\/b> If the physical universe (space, time, energy) had a beginning, it could not cause itself. It requires a Creator who operates independently outside of space, time, and physical energy to act as the First Cause.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://carm.org/about-science/thermodynamics-and-apologetics/' target='_blank'>Thermodynamics and Apologetics (CARM)<\/a><\/li><li><a href='https://reasons.org/explore/publications/articles/entropy-and-the-second-law-of-thermodynamics' target='_blank'>Entropy and the Second Law (Reasons to Believe)<\/a><\/li><\/ul>"
  },
  {
    "id": "core-29-dna-isn-t-biology-just-chemistry-not-design",
    "sourceId": "core",
    "sourceLabel": "Core Questions",
    "sourceShort": "Core",
    "sourceIndex": 28,
    "legacyNoteKey": "apologetics_note_28",
    "cat": "Science",
    "q": "DNA: Isn't biology just chemistry, not design?",
    "ref": "Psalm 139:13",
    "verse": "For you created my inmost being; you knit me together in my mother’s womb.",
    "a": "Bill Gates noted, 'DNA is like a computer program but far, far more advanced than any software ever created.' Information theory dictates that complex, specified information never arises spontaneously from random natural processes.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Information vs. Chemistry:<\/b> Blind chemistry can explain the physical bonding of the chemical letters (A, C, T, G), but it possesses no law to dictate the *sequencing* of those letters. Just as the physics of ink and paper don't write a Shakespearean sonnet, the chemistry of DNA don't author biological code.<\/li><li><b>The Chicken and Egg Problem:<\/b> DNA requires complex protein machines (ribosomes) to be read and replicated. However, the instructions to build ribosomes are *inside* the DNA. They both must exist simultaneously for life to function, confounding gradual evolutionary steps.<\/li><li><b>The Universal Signature:<\/b> Every single known instance of specified, functional information traced back to its source always originates in a mind, without exception. DNA bears the strict mathematical hallmark of an Intelligent Designer.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.discovery.org/a/10661/' target='_blank'>DNA and Information (Discovery Institute)<\/a><\/li><li><a href='https://evolutionnews.org/2021/04/the-information-enigma-where-does-information-come-from/' target='_blank'>The Information Enigma (Evolution News)<\/a><\/li><\/ul>"

    "a": "This is a profound misunderstanding of textual criticism. We have over 5,800 Greek manuscript fragments of the New Testament, some dating within decades of the originals. By comparing them, scholars reconstruct the original text with astonishing accuracy.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Parallel, Not Linear:<\/b> The 'telephone game' is linear and spoken, where one whisper ruins the rest. Biblical copying was parallel and written. If a scribe in Alexandria made a typo, thousands of manuscripts in Rome, Antioch, and Jerusalem act as an immediate corrective cross-check.<\/li><li><b>The Dead Sea Scrolls:<\/b> The discovery of the Dead Sea Scrolls in 1947 provided Old Testament manuscripts 1,000 years older than our previous copies. The Great Isaiah Scroll proved that Jewish scribes meticulously transmitted the text with virtually zero changes over a millennium.<\/li><li><b>Doctrinal Purity:<\/b> Expert Bruce Metzger notes the NT is over 99.5% textually pure. The remaining 0.5% consists almost entirely of spelling errors or inverted words (e.g., 'Christ Jesus' instead of 'Jesus Christ'). No core Christian doctrine rests on a disputed textual variant.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://www.csntm.org/' target='_blank'>Center for Study of NT Manuscripts<\/a><\/li><li><a href='https://str.org/w/has-the-bible-been-changed-like-the-telephone-game-' target='_blank'>Has the Bible Been Changed? (Stand to Reason)<\/a><\/li><\/ul>"

    "a": "Early church fathers uniformly attributed the Gospels to Matthew, Mark, Luke, and John by the 2nd century. Unlike anonymous apocryphal texts, there are zero competing traditions regarding the authorship of the four canonical Gospels.<br><br><b>Expanded Evidence:<\/b><ul><li><b>Unlikely Forgeries:<\/b> If the early church were forging names to gain apostolic authority, they would have picked heavyweights like Peter or James. Attributing Gospels to Mark (a youth who abandoned Paul) or Luke (a Gentile physician) proves authenticity; nobody would invent their authorship.<\/li><li><b>Title Tags:<\/b> The earliest manuscript fragments contain titles (*Kata Matthaion* - 'According to Matthew'). Scholar Martin Hengel argued that texts distributed across the Roman Empire required titles immediately upon distribution to avoid library confusion.<\/li><li><b>Eyewitness Topography:<\/b> Scholar Richard Bauckham notes that the precise use of rare local Jewish names, complex geography, and topography in the Gospels strongly validate that they are based on direct, local eyewitness testimony, not distant mythology.<\/li><\/ul><b>Trusted Resources:<\/b><ul><li><a href='https://coldcasechristianity.com/writings/are-the-gospels-anonymous/' target='_blank'>Are the Gospels Anonymous? (Cold-Case)<\/a><\/li><\/ul>"
