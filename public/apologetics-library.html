    "sourceIndex": 26,
    "legacyNoteKey": "apologetics_5_note_26",
    "cat": "Coincidences",
    "q": "The Green Grass: Why does Mark randomly mention 'green grass' at the feeding of the 5,000?",
    "ref": "Mark 6:39",
    "verse": "Then Jesus directed them to have all the people sit down in groups on the green grass.",
    "a": "Mark includes a trivial detail about the color of the grass that effortlessly aligns with a completely independent timeline clue found in John's Gospel.<br><br><b>Expanded Evidence:</b><ul><li><b>The Geography of Israel:</b> Israel is largely an arid desert. The grass there is only 'green' for a very narrow window of time in the early spring following the winter rains. By early summer, the intense heat turns everything brown and scorched.</li><li><b>John's Chronology:</b> In John 6:4, right before describing the exact same miracle, John casually mentions, 'The Jewish Passover Festival was near.' Passover always occurs in the early spring (March/April).</li><li><b>Unintentional Verification:</b> Mark mentions the biological reality on the ground. John mentions the liturgical calendar. They unintentionally lock together perfectly in the early spring, proving neither of them were making up the story from a distance centuries later.</li></ul>"
  },
  {
    "id": "expansion-28-herod-s-inner-circle-how-did-the-gospel-writers-know",
    "sourceId": "expansion",
    "sourceLabel": "30 Argument Expansion",
    "sourceShort": "Expansion",
    "sourceIndex": 27,
    "legacyNoteKey": "apologetics_5_note_27",
    "cat": "Coincidences",
    "q": "Herod's Inner Circle: How did the gospel writers know what King Herod said in private?",
    "ref": "Matthew 14:1-2",
    "verse": "At that time Herod the tetrarch heard the reports about Jesus, and he said to his attendants, 'This is John the Baptist; he has risen from the dead...'",
    "a": "Matthew records a private conversation inside the paranoid courts of Herod. Critics often ask how a group of poor Galilean fishermen could possibly know what the Tetrarch was whispering to his royal attendants.<br><br><b>Expanded Evidence:</b><ul><li><b>The Leak in the Palace:</b> We find the answer buried in a passing detail in Luke's Gospel. Luke 8:3 lists the wealthy women who financially supported Jesus' ministry.</li><li><b>Joanna's Connection:</b> Luke mentions 'Joanna the wife of Chuza, the manager of Herod’s household.' Chuza was essentially the Chief of Staff or prime minister of Herod's palace.</li><li><b>The Information Pipeline:</b> Matthew gives us the private quote from the palace. Luke, in a totally different context, provides the source of the leak. Joanna had direct, intimate access to the highest levels of Herod's court and passed the information to the disciples.</li></ul>"
  },
  {
    "id": "expansion-29-the-mending-of-nets-why-are-the-fishermen-mending-ne",
    "sourceId": "expansion",
    "sourceLabel": "30 Argument Expansion",
    "sourceShort": "Expansion",
    "sourceIndex": 28,
    "legacyNoteKey": "apologetics_5_note_28",
    "cat": "Coincidences",
    "q": "The Mending of Nets: Why are the fishermen mending nets in one Gospel and washing them in another?",
    "ref": "Matthew 4:21",
    "verse": "Going on from there, he saw two other brothers, James son of Zebedee and his brother John... preparing [mending] their nets.",
    "a": "The calling of the first disciples presents a fascinating interlocking puzzle between Matthew, Mark, and Luke that proves they were observing the same chaotic morning.<br><br><b>Expanded Evidence:</b><ul><li><b>The Aftermath:</b> Matthew and Mark simply state that Jesus walked by, saw James and John 'mending' their nets, and called them. They don't explain *why* the nets were torn. It's just a passing detail.</li><li><b>The Cause:</b> Luke 5 records the extended narrative of that morning. Jesus commands Peter to cast his nets into the deep. They catch an overwhelming, miraculous amount of fish, and Luke notes 'their nets began to break.'</li><li><b>Cause and Effect:</b> Luke provides the miraculous cause (the nets breaking under the weight of the fish). Matthew and Mark describe the mundane effect (the brothers sitting on the shore sewing the torn nets back together). They fit together like a lock and key.</li></ul>"
  },
  {
    "id": "expansion-30-the-request-of-james-and-john-did-the-brothers-ask-f",
    "sourceId": "expansion",
    "sourceLabel": "30 Argument Expansion",
    "sourceShort": "Expansion",
    "sourceIndex": 29,
    "legacyNoteKey": "apologetics_5_note_29",
    "cat": "Coincidences",
    "q": "The Request of James and John: Did the brothers ask for the throne, or did their mother?",
    "ref": "Matthew 20:20",
    "verse": "Then the mother of Zebedee’s sons came to Jesus with her sons and, kneeling down, asked a favor of him.",
    "a": "Mark 10 says James and John approached Jesus to ask for the seats of honor in the Kingdom. Matthew 20 says their *mother* came to ask. This apparent contradiction is actually a mark of authentic human behavior and eyewitness testimony.<br><br><b>Expanded Evidence:</b><ul><li><b>The Leverage of the Mother:</b> By cross-referencing the women at the cross in Matthew and Mark, we learn that the mother of Zebedee's sons is Salome. By cross-referencing John's Gospel, we learn Salome is likely Mary's sister. This makes James and John Jesus' first cousins.</li><li><b>The Political Play:</b> The brothers used their mother to leverage her familial status (Jesus' aunt) to secure the best seats in the administration. They put her up to it.</li><li><b>Jesus' Response:</b> This is proven by how Jesus answers in Matthew's account. Even though the mother asks the question, Jesus looks directly at the brothers and replies in the plural: 'You [plural] don't know what you are asking.' Jesus knew exactly who was behind the request. Mark streamlined the story; Matthew gave the embarrassing family politics.</li></ul>"
  },
  {
    "id": "exp-1-leibnizian-cosmological",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 0,
    "legacyNoteKey": "apologetics_exp_note_0",
    "cat": "Philosophy",
    "q": "Leibnizian Cosmological Argument: Why is there something rather than nothing?",
    "ref": "Colossians 1:16",
    "verse": "For in him all things were created: things in heaven and on earth, visible and invisible...",
    "a": "Gottfried Wilhelm Leibniz argued that everything that exists has an explanation of its existence, either in the necessity of its own nature or in an external cause. The universe does not exist by necessity, so it must have an external cause.<br><br><b>Expanded Evidence:</b><ul><li><b>The Principle of Sufficient Reason:</b> The idea that every true fact requires an explanation is the bedrock of all science and philosophy. If we abandon this principle for the universe itself, we undermine the basis for rational inquiry.</li><li><b>Not by Necessity:</b> A universe made of space, time, and matter could easily have *not* existed, or existed in a vastly different configuration. Therefore, it does not exist by necessity; it is contingent.</li><li><b>The Ultimate Cause:</b> If the universe is contingent, its explanation must lie outside of it. The only entity capable of causing space, time, and matter is a necessary, uncaused, timeless, spaceless, immaterial Mind (God).</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/existence-nature-of-god/the-new-atheism-and-five-arguments-for-god' target='_blank'>Leibnizian Cosmological Argument (Reasonable Faith)</a></li></ul>"
  },
  {
    "id": "exp-2-ontological-argument",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 1,
    "legacyNoteKey": "apologetics_exp_note_1",
    "cat": "Philosophy",
    "q": "Ontological Argument: Can we prove God exists simply by defining Him?",
    "ref": "Hebrews 11:6",
    "verse": "And without faith it is impossible to please God, because anyone who comes to him must believe that he exists...",
    "a": "Originally formulated by Anselm, and refined by Alvin Plantinga, the Ontological Argument asserts that if it is even *possible* that a Maximally Great Being (God) exists, then that Being must logically exist in reality.<br><br><b>Expanded Evidence:</b><ul><li><b>Maximal Greatness:</b> A maximally great being is defined as having all great-making properties (omniscience, omnipotence, moral perfection) in every possible world.</li><li><b>Existence as a Property:</b> It is greater to exist in reality than merely as an idea in the mind. Therefore, a maximally great being cannot exist *only* in our minds; if it did, we could conceive of a greater being (one that actually exists).</li><li><b>Modal Logic:</b> Plantinga showed that if it is logically possible for a Maximally Great Being to exist, it exists in some possible world. If it exists in some possible world, by definition of \"maximal greatness,\" it must exist in *all* possible worlds\u2014including the actual world.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/existence-nature-of-god/the-ontological-argument' target='_blank'>The Ontological Argument (Reasonable Faith)</a></li></ul>"
  },
  {
    "id": "exp-3-mathematics-and-god",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 2,
    "legacyNoteKey": "apologetics_exp_note_2",
    "cat": "Science",
    "q": "Mathematics and God: Why does the universe obey math?",
    "ref": "Proverbs 3:19",
    "verse": "By wisdom the Lord laid the earth\u2019s foundations, by understanding he set the heavens in place...",
    "a": "Physicist Eugene Wigner famously wrote about 'The Unreasonable Effectiveness of Mathematics in the Natural Sciences.' The fact that human abstract mathematical concepts perfectly describe the physical universe strongly points to a shared underlying rational Mind.<br><br><b>Expanded Evidence:</b><ul><li><b>Abstract vs. Physical:</b> Math is a non-material, conceptual construct of the human mind. The physical universe consists of mindless, blind matter. There is no physical reason why mindless matter should perfectly obey abstract human concepts.</li><li><b>Discovery, not Invention:</b> Mathematicians frequently 'discover' complex equations years before physicists realize those exact equations perfectly describe real-world phenomena (like quantum mechanics or general relativity).</li><li><b>The Divine Architect:</b> If an infinite, rational Mind created both the physical universe and the human mind, we have a perfect explanation for why our rational mathematics 'maps' seamlessly onto the physical structure of reality.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.str.org/' target='_blank'>Math and the Mind of God (Stand to Reason)</a></li></ul>"
  },
  {
    "id": "exp-4-privileged-planet",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 3,
    "legacyNoteKey": "apologetics_exp_note_3",
    "cat": "Science",
    "q": "Privileged Planet: Is Earth just a random speck in a vast universe?",
    "ref": "Psalm 115:16",
    "verse": "The highest heavens belong to the Lord, but the earth he has given to mankind.",
    "a": "The 'Privileged Planet' hypothesis argues that the exact same rare conditions required to sustain complex life also simultaneously make Earth the perfect platform for scientific discovery and observation.<br><br><b>Expanded Evidence:</b><ul><li><b>The Habitable Zones:</b> Earth rests precisely in the galactic habitable zone, the circumstellar habitable zone, and the planetary habitable zone. Moving us slightly in any direction would result in deadly radiation or freezing/boiling temperatures.</li><li><b>Perfect Solar Eclipses:</b> Earth is the only known planet where the moon is 400 times smaller than the sun, and the sun is exactly 400 times further away. This produces perfect solar eclipses, which allowed scientists to discover the composition of stars and prove Einstein\u2019s theory of relativity.</li><li><b>A Transparent Atmosphere:</b> Unlike planets with thick, cloudy atmospheres, Earth's atmosphere is uniquely clear, containing the perfect mix of gases to support biological life while simultaneously acting as a transparent window allowing us to observe the cosmos.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.discovery.org/v/the-privileged-planet/' target='_blank'>The Privileged Planet (Discovery Institute)</a></li></ul>"
  },
  {
    "id": "exp-5-irreducible-complexity",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 4,
    "legacyNoteKey": "apologetics_exp_note_4",
    "cat": "Science",
    "q": "Irreducible Complexity: Can complex biological machines evolve step-by-step?",
    "ref": "Psalm 139:14",
    "verse": "I praise you because I am fearfully and wonderfully made; your works are wonderful, I know that full well.",
    "a": "Biochemist Michael Behe coined the term 'Irreducible Complexity' to describe biological systems that require multiple interacting parts to function. If you remove even one part, the entire system breaks down, rendering slow, step-by-step evolution impossible.<br><br><b>Expanded Evidence:</b><ul><li><b>The Mousetrap Analogy:</b> A standard mousetrap has five parts (base, catch, spring, hammer, hold-down bar). If you remove the spring, it doesn't catch mice 20% worse\u2014it doesn't work at all. It must be assembled all at once.</li><li><b>The Bacterial Flagellum:</b> Many bacteria possess an outboard microscopic motor called a flagellum. It contains a rotor, stator, drive shaft, U-joint, and propeller, functioning identically to an engineered human motor. Removing any protein makes it completely useless, meaning natural selection could not have built it in slow, functional steps.</li><li><b>Blood Clotting:</b> The human blood clotting cascade requires over a dozen highly specific proteins activating in precise order. If one is missing, the animal either bleeds to death or suffers fatal, massive internal clots. The system must be fully intact from the beginning to ensure survival.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://evolutionnews.org/irreducible-complexity/' target='_blank'>Irreducible Complexity (Evolution News)</a></li></ul>"
  },
  {
    "id": "exp-6-problem-of-good",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 5,
    "legacyNoteKey": "apologetics_exp_note_5",
    "cat": "Philosophy",
    "q": "The Problem of Good: Why does the existence of 'good' point to God?",
    "ref": "Psalm 34:8",
    "verse": "Taste and see that the Lord is good; blessed is the one who takes refuge in him.",
    "a": "Atheists frequently leverage the 'Problem of Evil' against God. However, identifying anything as objectively 'evil' requires an objective standard of 'good,' which atheism cannot provide.<br><br><b>Expanded Evidence:</b><ul><li><b>The Shadow Requires Light:</b> Evil is not a substance; it is a corruption of a good substance (like rust on a car or rot in a tree). You cannot have a corruption without an original, pure standard.</li><li><b>The Atheistic Dilemma:</b> If there is no God, the universe is just a collection of blind physical forces. An earthquake that kills thousands isn't 'evil' in a secular worldview; it's just tectonic friction. Declaring something 'unjust' requires a standard of absolute justice beyond human opinion.</li><li><b>God is the Standard:</b> The only way to complain that the world is broken is to possess an innate knowledge of how the world is *supposed* to be. This universal moral intuition points directly to a benevolent Creator who inscribed His nature on the human heart.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/existence-nature-of-god/the-moral-argument/' target='_blank'>The Moral Argument (Reasonable Faith)</a></li></ul>"
  },
  {
    "id": "exp-7-meaning-without-god",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 6,
    "legacyNoteKey": "apologetics_exp_note_6",
    "cat": "Philosophy",
    "q": "Meaning without God: Can we create our own meaning in an atheistic universe?",
    "ref": "Ecclesiastes 1:2",
    "verse": "Meaningless! Meaningless!\u201d says the Teacher. \u201cUtterly meaningless! Everything is meaningless.\u201d",
    "a": "Philosopher William Lane Craig argues that if God does not exist, human life ultimately ends in the grave, and the universe will eventually suffer heat death. In a doomed universe, any 'meaning' we invent is a subjective illusion.<br><br><b>Expanded Evidence:</b><ul><li><b>The Unyielding Reality of Death:</b> Existentialist philosophers like Jean-Paul Sartre admitted that without God, life is absurd. If your destiny and the destiny of the universe is eternal, cold oblivion, then the ultimate outcome of the saint and the serial killer is exactly the same.</li><li><b>Noble Lies:</b> Atheists often suggest we can 'create our own meaning.' However, this is simply playing pretend. Pretending the universe cares about your actions doesn't change the objective reality that you are a cosmic accident marching toward extinction.</li><li><b>The Anchor of Eternity:</b> True, objective meaning requires two things: God (to provide an absolute standard of value) and Immortality (to ensure that our choices have permanent, eternal consequences). Christianity provides both.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.reasonablefaith.org/writings/popular-writings/existence-nature-of-god/the-absurdity-of-life-without-god/' target='_blank'>The Absurdity of Life without God (Reasonable Faith)</a></li></ul>"
  },
  {
    "id": "exp-8-faith-vs-blind-leap",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 7,
    "legacyNoteKey": "apologetics_exp_note_7",
    "cat": "Philosophy",
    "q": "Faith vs. Blind Leap: Is biblical faith just believing without evidence?",
    "ref": "Hebrews 11:1",
    "verse": "Now faith is confidence in what we hope for and assurance about what we do not see.",
    "a": "The modern secular definition of faith is 'believing something in spite of the evidence.' The biblical definition of faith (Greek: *pistis*) is 'trusting in an authority based upon compelling evidence.'<br><br><b>Expanded Evidence:</b><ul><li><b>Not a Blind Leap:</b> When Jesus commanded people to believe in Him, He didn't ask for blind credulity. He pointed to His miracles as the objective evidence validating His authority (John 10:37-38).</li><li><b>The Courtroom Analogy:</b> A jury cannot 'see' the murder happen, but they can examine the fingerprints, testimonies, and forensics to arrive at a confident verdict beyond a reasonable doubt. Biblical faith operates exactly like a courtroom verdict\u2014trust based on historical and logical evidence.</li><li><b>Faith is Active Trust:</b> You can intellectually believe an airplane can fly, but 'faith' is stepping onto the plane. Christian faith is the active yielding of one's life to the verified, historical reality of Jesus' resurrection.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://coldcasechristianity.com/writings/why-christian-faith-is-not-blind-faith/' target='_blank'>Why Christian Faith is Not Blind Faith (Cold-Case)</a></li></ul>"
  },
  {
    "id": "exp-9-rise-of-the-university",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 8,
    "legacyNoteKey": "apologetics_exp_note_8",
    "cat": "Society",
    "q": "Rise of the University: Did secularism invent higher education?",
    "ref": "Colossians 2:3",
    "verse": "In whom are hidden all the treasures of wisdom and knowledge.",
    "a": "The modern university is an exclusive invention of the medieval Catholic Church, born out of the deeply Christian conviction that exploring God's creation is a form of worship.<br><br><b>Expanded Evidence:</b><ul><li><b>The First Institutions:</b> The first universities in history\u2014Bologna, Paris, and Oxford\u2014were birthed directly out of cathedral schools in the 11th and 12th centuries to train clergy, lawyers, and physicians.</li><li><b>A Rational Universe:</b> Pagan cultures believed the world was governed by chaotic, competing gods, making nature unpredictable. Christianity taught that a singular, rational God authored a singular, rational universe, making the pursuit of organized, scientific study both possible and noble.</li><li><b>Scholasticism:</b> Christian scholastic thinkers like Thomas Aquinas established the rigorous academic traditions of logic, debate, and the integration of faith and reason, laying the foundation for modern academia.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.str.org/' target='_blank'>Christianity and the Rise of Universities (Stand to Reason)</a></li></ul>"
  },
  {
    "id": "exp-10-monasteries-and-literacy",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 9,
    "legacyNoteKey": "apologetics_exp_note_9",
    "cat": "Society",
    "q": "Monasteries and Literacy: Did Christianity cause the 'Dark Ages'?",
    "ref": "Deuteronomy 6:6-7",
    "verse": "These commandments that I give you today are to be on your hearts. Impress them on your children...",
    "a": "The term 'Dark Ages' is a heavily biased Enlightenment myth. Following the collapse of the Roman Empire, it was the Christian monasteries that single-handedly saved Western literacy and classical knowledge.<br><br><b>Expanded Evidence:</b><ul><li><b>The Scriptoriums:</b> As barbaric tribes sacked Rome and burned libraries, Christian monks retreated to isolated monasteries (like those in Ireland). They spent their lives meticulously copying not only the Bible, but the works of Cicero, Plato, and Aristotle, preserving them for future generations.</li><li><b>Invention of the Book:</b> Early Christians pioneered the transition from cumbersome scrolls to the bound *codex* (the modern book format) because it allowed for quicker referencing of Scripture, revolutionizing the storage of information.</li><li><b>Agricultural Revolution:</b> Monks didn't just pray; they were the leading agronomists and technologists of the medieval period, developing waterwheels, metallurgy, and crop rotation, actively pulling Europe out of economic despair.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.str.org/' target='_blank'>How the Church Saved Western Civilization (Stand to Reason)</a></li></ul>"
  },
  {
    "id": "exp-11-james-conversion",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 10,
    "legacyNoteKey": "apologetics_exp_note_10",
    "cat": "History",
    "q": "James' Conversion: Why did Jesus' skeptical brother suddenly lead the church?",
    "ref": "1 Corinthians 15:7",
    "verse": "Then he appeared to James, then to all the apostles...",
    "a": "The radical conversion of James, the half-brother of Jesus, is one of the strongest historical proofs for the Resurrection. He went from mocking Jesus to dying as a Christian martyr.<br><br><b>Expanded Evidence:</b><ul><li><b>Hostile Skepticism:</b> The Gospels candidly admit that during Jesus' ministry, His own brothers thought He was out of His mind and did not believe in Him (John 7:5, Mark 3:21). This is a highly embarrassing detail the early church would never have invented.</li><li><b>The Catalyst:</b> In 1 Corinthians 15, an incredibly early creed records that the resurrected Jesus made a specific, personal appearance to James. Suddenly, James appears in the Book of Acts as the primary leader of the Jerusalem church.</li><li><b>The Ultimate Price:</b> The Jewish historian Josephus (a non-Christian) explicitly records that James was stoned to death by the Jewish high priest Ananus around 62 AD for his unwavering claim that his brother was the resurrected Lord. Men do not die for a sibling's lie.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.garyhabermas.com/' target='_blank'>The Conversion of James (Dr. Gary Habermas)</a></li></ul>"
  },
  {
    "id": "exp-12-paul-conversion",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 11,
    "legacyNoteKey": "apologetics_exp_note_11",
    "cat": "History",
    "q": "Paul's Conversion: Why did the church's greatest enemy become its greatest apostle?",
    "ref": "Acts 9:3-4",
    "verse": "As he neared Damascus on his journey, suddenly a light from heaven flashed around him. He fell to the ground and heard a voice say to him, 'Saul, Saul, why do you persecute me?'",
    "a": "Saul of Tarsus had everything to lose\u2014wealth, power, and Pharisaical prestige\u2014by becoming a Christian. His sudden, radical pivot is historically inexplicable without a genuine encounter with the risen Christ.<br><br><b>Expanded Evidence:</b><ul><li><b>The Hostile Witness:</b> Saul was the chief executioner of early Christians. He was not psychologically primed or 'hoping' for a resurrection. He genuinely believed he was doing God's work by destroying a blasphemous cult.</li><li><b>The Unprecedented Pivot:</b> After his experience on the Damascus road, Paul endured beatings, shipwrecks, imprisonments, and starvation to preach the very message he previously hated, culminating in his beheading in Rome.</li><li><b>No Ulterior Motive:</b> People invent religions for wealth, sex, or power. Paul gained none of these. He abandoned a life of Jewish elite privilege for a life of poverty and persecution among Gentiles.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://coldcasechristianity.com/writings/the-evidence-of-the-apostle-paul/' target='_blank'>The Evidence of the Apostle Paul (Cold-Case)</a></li></ul>"
  },
  {
    "id": "exp-13-the-holy-sepulchre",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 12,
    "legacyNoteKey": "apologetics_exp_note_12",
    "cat": "Archaeology",
    "q": "The Holy Sepulchre: Do we actually know where Jesus was buried?",
    "ref": "John 19:41",
    "verse": "At the place where Jesus was crucified, there was a garden, and in the garden a new tomb, in which no one had ever been laid.",
    "a": "Historical and archaeological evidence strongly point to the Church of the Holy Sepulchre in Jerusalem as the authentic, continuous location of Jesus' crucifixion and empty tomb.<br><br><b>Expanded Evidence:</b><ul><li><b>The Pagan Cover-Up:</b> In 135 AD, the Roman Emperor Hadrian deliberately built a massive pagan temple to Venus directly over a specific Jewish quarry site in Jerusalem. His goal was to bury a site that early Christians were heavily venerating.</li><li><b>Constantine's Excavation:</b> In 325 AD, Emperor Constantine demolished the pagan temple and excavated the bedrock below. He uncovered an ancient Jewish tomb dating perfectly to the 1st century, immediately building a basilica over it.</li><li><b>Modern Verification:</b> Recent restorative excavations (2016) confirmed that the original limestone burial bed from the 1st century is still perfectly intact beneath the marble shrine, proving that the geographical memory of the early church was astonishingly accurate.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.biblicalarchaeology.org/' target='_blank'>Church of the Holy Sepulchre (Biblical Archaeology Society)</a></li></ul>"
  },
  {
    "id": "exp-14-pool-of-bethesda",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 13,
    "legacyNoteKey": "apologetics_exp_note_13",
    "cat": "Archaeology",
    "q": "Pool of Bethesda: Was the Gospel of John geographically inaccurate?",
    "ref": "John 5:2",
    "verse": "Now there is in Jerusalem near the Sheep Gate a pool, which in Aramaic is called Bethesda and which is surrounded by five covered colonnades.",
    "a": "For centuries, skeptics claimed the Gospel of John was a late forgery because no \"five-colonnaded pool\" existed in Jerusalem. Archaeology later proved the skeptics wrong and John completely right.<br><br><b>Expanded Evidence:</b><ul><li><b>The Skeptical Claim:</b> Because the Romans completely destroyed Jerusalem in 70 AD, the precise topography of the city was lost. Critics argued that the 'five colonnades' were just a theological metaphor for the five books of Moses.</li><li><b>The Discovery:</b> In the late 19th century, archaeologists digging near the Church of St. Anne in Jerusalem hit a massive, ancient water complex.</li><li><b>The Five Porches:</b> They uncovered exactly what John described: two large rectangular pools separated by a central dividing wall, resulting in a unique structure with exactly five covered porches (four around the perimeter, one across the middle). It dates precisely to the 1st century.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://apologeticspress.org/archaeology-and-the-new-testament/' target='_blank'>Archaeology and the New Testament (Apologetics Press)</a></li></ul>"
  },
  {
    "id": "exp-15-caiaphas-ossuary",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 14,
    "legacyNoteKey": "apologetics_exp_note_14",
    "cat": "Archaeology",
    "q": "Caiaphas Ossuary: Is there proof of the High Priest who condemned Jesus?",
    "ref": "Matthew 26:57",
    "verse": "Those who had arrested Jesus took him to Caiaphas the high priest, where the teachers of the law and the elders had assembled.",
    "a": "Yes. In 1990, construction workers in Jerusalem accidentally uncovered an ancient burial cave containing an incredibly ornate limestone ossuary (bone box) belonging to the family of the High Priest.<br><br><b>Expanded Evidence:</b><ul><li><b>The Aramaic Inscription:</b> The side of the highly decorated ossuary bears a clear Aramaic inscription reading: 'Joseph, son of Caiaphas.' The Jewish historian Josephus confirms that the High Priest during Jesus' time was indeed named Joseph Caiaphas.</li><li><b>The Contents:</b> Inside the box were the bones of a 60-year-old man, aligning perfectly with the age and era of the biblical High Priest.</li><li><b>A Tangible Villain:</b> This physical artifact bridges the gap between the biblical text and hard history, proving that the primary antagonist of the Gospel passion narratives was a real, deeply established historical figure in Jerusalem.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.biblicalarchaeology.org/' target='_blank'>The Caiaphas Ossuary (Biblical Archaeology Society)</a></li></ul>"
  },
  {
    "id": "exp-16-mesha-stele",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 15,
    "legacyNoteKey": "apologetics_exp_note_15",
    "cat": "Archaeology",
    "q": "Moabite Stone: Does archaeology support the Old Testament wars?",
    "ref": "2 Kings 3:4-5",
    "verse": "Now Mesha king of Moab raised sheep... But after Ahab died, the king of Moab rebelled against the king of Israel.",
    "a": "The Mesha Stele (or Moabite Stone), discovered in 1868 in modern-day Jordan, provides stunning corroboration of the political and military events recorded in the Book of 2 Kings.<br><br><b>Expanded Evidence:</b><ul><li><b>The Enemy's Perspective:</b> Written around 840 BC by King Mesha of Moab, the monument boasts of his successful rebellion against the kingdom of Israel, offering an incredibly rare 'enemy perspective' of a biblical event.</li><li><b>Specific Confirmations:</b> The stone explicitly names the Israelite King Omri, acknowledges that Israel had oppressed Moab, and even references Yahweh (the God of Israel) and the House of David.</li><li><b>Historical Synchronization:</b> While Mesha understandably brags about his victories (omitting his own defeats), the core political landscape, the key figures, and the geopolitical tensions exactly match the biblical narrative of 2 Kings 3.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.biblicalarchaeology.org/' target='_blank'>The Mesha Stele (Biblical Archaeology Society)</a></li></ul>"
  },
  {
    "id": "exp-17-dead-sea-scrolls",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 16,
    "legacyNoteKey": "apologetics_exp_note_16",
    "cat": "Bible",
    "q": "Dead Sea Scrolls: Did the monks change the Old Testament over time?",
    "ref": "Isaiah 40:8",
    "verse": "The grass withers and the flowers fall, but the word of our God endures forever.",
    "a": "The discovery of the Dead Sea Scrolls in 1947 in the Qumran caves proved that the Old Testament text was transmitted with astonishing, unprecedented accuracy by Jewish scribes over millennia.<br><br><b>Expanded Evidence:</b><ul><li><b>The Masoretic Text:</b> Before 1947, our oldest complete Hebrew Bible was the Leningrad Codex (dated 1008 AD). Skeptics assumed that thousands of years of copying must have corrupted the prophecies and history.</li><li><b>A 1,000-Year Leap:</b> The Qumran scrolls dated back to between 150 BC and 70 AD\u2014jumping back a full thousand years. They contained every Old Testament book except Esther.</li><li><b>The Verdict:</b> When scholars compared the Great Isaiah Scroll from Qumran to the 1008 AD Masoretic text, they found them to be 95% identical word-for-word. The 5% variation consisted entirely of minor spelling updates or slips of the pen. The text was preserved completely intact.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.str.org/' target='_blank'>Significance of the Dead Sea Scrolls (Stand to Reason)</a></li></ul>"
  },
  {
    "id": "exp-18-iliad-vs-nt",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 17,
    "legacyNoteKey": "apologetics_exp_note_17",
    "cat": "Bible",
    "q": "Iliad vs. NT: Is the New Testament better preserved than other ancient books?",
    "ref": "Matthew 24:35",
    "verse": "Heaven and earth will pass away, but my words will never pass away.",
    "a": "When subjected to standard bibliographical tests used by secular historians, the New Testament is by far the most historically reliable and well-preserved document from all of antiquity.<br><br><b>Expanded Evidence:</b><ul><li><b>Homer's Iliad:</b> The 'runner up' for ancient literature is Homer's *Iliad*, with roughly 1,900 surviving manuscript copies. The gap between the original writing and the earliest copy is about 500 years.</li><li><b>The NT Avalanche:</b> By contrast, the New Testament is supported by over 5,800 Greek manuscripts, plus over 15,000 translations in Latin, Coptic, and Syriac.</li><li><b>The Time Gap:</b> The gap between the original NT writings and our earliest fragments (like the P52 fragment of John) is mere decades. If historians reject the textual reliability of the New Testament, they must logically discard every other historical book of antiquity (Caesar, Plato, Aristotle) along with it.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://carm.org/about-the-bible/manuscript-evidence-for-superior-new-testament-reliability/' target='_blank'>Manuscript Evidence for NT Reliability (CARM)</a></li></ul>"
  },
  {
    "id": "exp-19-bartimaeus-contradiction",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 18,
    "legacyNoteKey": "apologetics_exp_note_18",
    "cat": "Contradictions",
    "q": "Bartimaeus Contradiction: Did Jesus heal one blind man or two in Jericho?",
    "ref": "Matthew 20:30 & Mark 10:46",
    "verse": "Matthew: 'Two blind men were sitting by the roadside...' | Mark: '...a blind man, Bartimaeus, was sitting by the roadside begging.'",
    "a": "This is another example of a complementary omission, not a logical contradiction. Mark chooses to zoom in on a specific, named individual for pastoral reasons, while Matthew provides the full head-count.<br><br><b>Expanded Evidence:</b><ul><li><b>The Rule of Inclusion:</b> Mark does not say Jesus healed 'only' one blind man. He simply focuses his narrative entirely on Bartimaeus, likely because Bartimaeus became a known, prominent figure in the early church.</li><li><b>Historical Analogies:</b> If a journalist writes, 'The President and the Vice President visited the disaster site,' and another journalist writes, 'The President visited the disaster site and gave a speech,' the second journalist isn't lying. He is just focusing the story on the primary actor.</li><li><b>Independent Sourcing:</b> These minor variations in perspective are exactly what cold-case detectives look for to verify that witnesses did not collude and fabricate a perfectly identical story.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://carm.org/bible-difficulties/how-many-blind-men-were-healed-one-or-two/' target='_blank'>How Many Blind Men? (CARM)</a></li></ul>"
  },
  {
    "id": "exp-20-staff-contradiction",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 19,
    "legacyNoteKey": "apologetics_exp_note_19",
    "cat": "Contradictions",
    "q": "Staff Contradiction: Did Jesus tell the disciples to take a staff or not?",
    "ref": "Matthew 10:9-10 & Mark 6:8",
    "verse": "Matthew: 'Do not get any gold... or an extra shirt or sandals or a staff.' | Mark: 'Take nothing for the journey except a staff...'",
    "a": "This apparent contradiction is beautifully resolved by looking at the specific Greek verbs used in the original texts, revealing two different instructions regarding provision.<br><br><b>Expanded Evidence:</b><ul><li><b>Matthew's Verb (Ktaomai):</b> In Matthew, the Greek verb used is *ktaomai*, which means 'to acquire' or 'to procure.' Jesus is saying, 'Do not go out and buy a *new* staff, new sandals, or a new tunic for this trip.'</li><li><b>Mark's Verb (Airo):</b> In Mark, the Greek verb used is *airo*, which means 'to take up' or 'to carry.' Jesus is saying, 'Take up the staff you already have.'</li><li><b>The Underlying Point:</b> Both accounts teach the exact same theological lesson: The disciples are to go immediately, relying entirely on God's provision and the hospitality of others, without wasting time packing or purchasing extra supplies.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://apologeticspress.org/take-a-staff-or-not-709/' target='_blank'>Take a Staff or Not? (Apologetics Press)</a></li></ul>"
  },
  {
    "id": "exp-21-potters-field",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 20,
    "legacyNoteKey": "apologetics_exp_note_20",
    "cat": "Contradictions",
    "q": "Potter's Field: Who bought the field of blood, Judas or the priests?",
    "ref": "Matthew 27:7 & Acts 1:18",
    "verse": "Matthew: 'So they [the priests] decided to use the money to buy the potter\u2019s field...' | Acts: 'With the payment he received for his wickedness, Judas bought a field...'",
    "a": "This is resolved by understanding ancient Jewish legal agency and the concept of 'blood money.' The priests physically executed the purchase, but legally, it was done in Judas' name with his funds.<br><br><b>Expanded Evidence:</b><ul><li><b>Blood Money Laws:</b> Deuteronomy 23:18 forbade placing 'unclean' money (like a prostitute's wages or blood money) into the temple treasury. When Judas threw the silver back into the temple, the priests legally could not accept it into the general fund.</li><li><b>Legal Ownership:</b> Because the money still legally belonged to Judas, the priests acted as proxy agents. They bought the Potter's Field *on his behalf* to be used as a cemetery for foreigners.</li><li><b>Modern Equivalence:</b> If you give a real estate agent money to buy a house, and someone asks who bought the house, it is equally true to say 'The agent bought the house' (Matthew's physical action focus) and 'You bought the house' (Luke's legal ownership focus in Acts).</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.gotquestions.org/Potters-Field.html' target='_blank'>Who Bought the Potter's Field? (GotQuestions)</a></li></ul>"
  },
  {
    "id": "exp-22-mustard-seed",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 21,
    "legacyNoteKey": "apologetics_exp_note_21",
    "cat": "Contradictions",
    "q": "Mustard Seed: Why did Jesus say it's the smallest seed when orchids are smaller?",
    "ref": "Mark 4:31",
    "verse": "It is like a mustard seed, which is the smallest of all seeds on earth.",
    "a": "Jesus was an itinerant Rabbi speaking to 1st-century agrarian farmers, not a 21st-century botanist writing a scientific textbook. He was employing a common cultural idiom.<br><br><b>Expanded Evidence:</b><ul><li><b>Proverbial Speech:</b> In ancient Jewish culture, the mustard seed was the proverbial idiom for 'the smallest conceivable thing' (similar to how we might say something is 'a drop in the bucket').</li><li><b>Agrarian Context:</b> Jesus specifically frames the context around agriculture ('when planted in the ground'). The black mustard seed was undeniably the smallest seed actively sown by ancient Palestinian farmers in their gardens.</li><li><b>The Point Remains:</b> The theological point\u2014that the Kingdom of God starts imperceptibly small but grows into a massive shelter\u2014is perfectly illustrated using the local, colloquial language of the audience. Demanding pedantic botanical precision misses the entire genre of the parable.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://carm.org/bible-difficulties/is-the-mustard-seed-the-smallest-of-all-seeds/' target='_blank'>Is the Mustard Seed the Smallest? (CARM)</a></li></ul>"
  },
  {
    "id": "exp-23-joseph-typology",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 22,
    "legacyNoteKey": "apologetics_exp_note_22",
    "cat": "Typology",
    "q": "Joseph Typology: How does Joseph foreshadow Jesus?",
    "ref": "Genesis 50:20",
    "verse": "You intended to harm me, but God intended it for good to accomplish what is now being done, the saving of many lives.",
    "a": "The story of Joseph (Genesis 37-50) is one of the most detailed, breathtaking prophetic 'types' (foreshadowings) of Jesus Christ in the entire Old Testament, revealing the divine authorship of history.<br><br><b>Expanded Evidence:</b><ul><li><b>Betrayal for Silver:</b> Both Jesus and Joseph were the beloved sons of their fathers. Both were betrayed by their own 'brothers' (the tribes of Israel) and sold to Gentiles for pieces of silver.</li><li><b>Suffering then Glory:</b> Both were falsely accused, suffered unjustly with two criminals (the baker and cupbearer / the two thieves on crosses), and were ultimately exalted to the right hand of the supreme ruler (Pharaoh / God the Father).</li><li><b>Salvation of the Betrayers:</b> In the ultimate climax, Joseph uses his exalted position of power not to crush the brothers who betrayed him, but to offer them mercy and bread to save them from death. Jesus uses His exaltation to offer the Bread of Life and salvation to the very world that crucified Him.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.thegospelcoalition.org/article/joseph-type-of-christ/' target='_blank'>Joseph as a Type of Christ (TGC)</a></li></ul>"
  },
  {
    "id": "exp-24-bronze-serpent",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 23,
    "legacyNoteKey": "apologetics_exp_note_23",
    "cat": "Typology",
    "q": "Bronze Serpent: Why did God use a snake to heal the Israelites?",
    "ref": "John 3:14-15",
    "verse": "Just as Moses lifted up the snake in the wilderness, so the Son of Man must be lifted up, that everyone who believes may have eternal life in him.",
    "a": "In Numbers 21, the Israelites are dying from venomous snake bites. God commands Moses to put a bronze serpent on a pole; anyone who looks at it will live. Jesus explicitly claimed this bizarre event was a picture of the cross.<br><br><b>Expanded Evidence:</b><ul><li><b>The Symbol of the Curse:</b> In biblical theology, the serpent is the ultimate symbol of sin and the curse (Genesis 3). God commands Moses to mount the very symbol of their death upon a pole.</li><li><b>The Great Exchange:</b> On the cross, Jesus did not just die for sin; Paul writes that God 'made him who had no sin to *be* sin for us' (2 Cor. 5:21). Jesus visually took on the curse of humanity upon the wooden pole.</li><li><b>Faith through Sight:</b> The Israelites were not cured by making a medicine or earning merit. They were cured by simply looking in faith at the elevated substitute. Jesus says salvation operates the exact same way: looking to His finished work on the cross.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.gotquestions.org/bronze-serpent.html' target='_blank'>The Bronze Serpent (GotQuestions)</a></li></ul>"
  },
  {
    "id": "exp-25-melchizedek",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 24,
    "legacyNoteKey": "apologetics_exp_note_24",
    "cat": "Typology",
    "q": "Melchizedek: Who was this mysterious king, and why does he matter?",
    "ref": "Hebrews 7:3",
    "verse": "Without father or mother, without genealogy, without beginning of days or end of life, resembling the Son of God, he remains a priest forever.",
    "a": "Melchizedek suddenly appears in Genesis 14 to bless Abraham. The writer of Hebrews uses him to prove that Jesus' priesthood is ancient, royal, and vastly superior to the Levitical priesthood of the Jewish law.<br><br><b>Expanded Evidence:</b><ul><li><b>King and Priest:</b> In Israel, the crown (King) and the altar (Priest) were strictly separated. Kings came from Judah; priests came from Levi. Melchizedek, however, was both the 'King of Salem' (Peace) and 'Priest of God Most High.' Jesus unites these two offices forever.</li><li><b>No Genealogy:</b> The Levitical priesthood required strict, pedantic genealogical records to prove descent from Aaron. Melchizedek arrives in the text with no recorded genealogy, symbolizing an eternal priesthood based on inherent worth, not tribal lineage.</li><li><b>The Bread and Wine:</b> When Melchizedek meets Abraham, he surprisingly brings out bread and wine\u2014the exact elements Jesus would use thousands of years later at the Last Supper to establish the New Covenant.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.str.org/' target='_blank'>Who Was Melchizedek? (Stand to Reason)</a></li></ul>"
  },
  {
    "id": "exp-26-mormonism",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 25,
    "legacyNoteKey": "apologetics_exp_note_25",
    "cat": "World Religions",
    "q": "Mormonism: How is the Bible different from the Book of Mormon?",
    "ref": "Proverbs 30:5-6",
    "verse": "Every word of God is flawless... Do not add to his words, or he will rebuke you and prove you a liar.",
    "a": "While both claim divine inspiration, the Bible is deeply anchored in verifiable historical geography, archaeology, and manuscript traditions, whereas the Book of Mormon possesses virtually none of these authenticating marks.<br><br><b>Expanded Evidence:</b><ul><li><b>Archaeological Silence:</b> The Bible accurately names hundreds of cities, kings, and empires that archaeologists have dug up (Jericho, Nineveh, Pontius Pilate). The Book of Mormon describes massive, sprawling ancient American civilizations (Nephites/Lamanites) with steel swords, chariots, and millions of people, yet not a single geographical site or artifact has ever been found.</li><li><b>Anachronisms:</b> The Book of Mormon mentions horses, elephants, wheat, and steel in pre-Columbian America\u2014items that historians and biologists definitively know did not exist in the Americas until the Spanish arrived centuries later.</li><li><b>No Ancient Manuscripts:</b> We have over 5,800 ancient Greek manuscripts of the New Testament. There is not a single ancient manuscript of the 'Reformed Egyptian' language Joseph Smith claimed to translate from the golden plates.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://carm.org/mormonism/' target='_blank'>Mormonism (CARM)</a></li></ul>"
  },
  {
    "id": "exp-27-pantheism-vs-theism",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 26,
    "legacyNoteKey": "apologetics_exp_note_26",
    "cat": "World Religions",
    "q": "Pantheism vs. Theism: Are we all just 'one with the universe'?",
    "ref": "Isaiah 44:24",
    "verse": "I am the Lord, the Maker of all things, who stretches out the heavens, who spreads out the earth by myself...",
    "a": "Eastern pantheism and modern New Age spirituality claim that 'God is everything and everything is God.' Theism (Christianity) argues that God is distinctly separate from His creation, like an artist is separate from a painting.<br><br><b>Expanded Evidence:</b><ul><li><b>The Problem of Evil:</b> If the universe is God, and God is all there is, then cancer, murder, and child abuse are all divine. Pantheism has no logical way to condemn evil because evil is just another part of God.</li><li><b>The Illusion of Self:</b> Pantheism teaches that individual personality is an illusion (*Maya*) and the goal is to melt back into the impersonal cosmic consciousness. Christianity teaches that individual personality is profoundly real and designed for eternal, interpersonal relationship with the Creator.</li><li><b>The Cosmological Barrier:</b> Science overwhelmingly supports the Big Bang\u2014that physical reality had an absolute beginning. If the universe had a beginning, it cannot *be* the eternal God. God must transcend the physical universe to create it.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.str.org/' target='_blank'>Pantheism vs. Christian Theism (Stand to Reason)</a></li></ul>"
  },
  {
    "id": "exp-28-karma-vs-grace",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 27,
    "legacyNoteKey": "apologetics_exp_note_27",
    "cat": "World Religions",
    "q": "Karma vs. Grace: Don't all religions teach we must be good to reach heaven?",
    "ref": "Ephesians 2:8-9",
    "verse": "For it is by grace you have been saved, through faith\u2014and this is not from yourselves, it is the gift of God\u2014not by works, so that no one can boast.",
    "a": "Almost every major world religion operates on the principle of Karma or merit: what you put out, you get back. Christianity is the radical outlier that offers an entirely different operating system: Grace.<br><br><b>Expanded Evidence:</b><ul><li><b>The Crushing Weight of Karma:</b> Karma is an impersonal, merciless law of cause and effect. If you sin, you must suffer the consequences in this life or the next (reincarnation) until the debt is paid. There is no forgiveness, only endless striving.</li><li><b>The End of the Ladder:</b> Religion is man trying to climb a ladder of good works to reach God. Christianity is God coming down the ladder to rescue man.</li><li><b>The Substitute:</b> Grace means 'unmerited favor.' In Christianity, the cosmic debt of justice is not ignored, but it is absorbed by God Himself on the cross. The ledger is cleared not by our performance, but by Christ's substitute sacrifice, offering true rest.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.thegospelcoalition.org/' target='_blank'>The Uniqueness of Christian Grace (TGC)</a></li></ul>"
  },
  {
    "id": "exp-29-polytheism-vs-monotheism",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 28,
    "legacyNoteKey": "apologetics_exp_note_28",
    "cat": "World Religions",
    "q": "Polytheism vs. Monotheism: Why couldn't there be multiple gods?",
    "ref": "Isaiah 45:5",
    "verse": "I am the Lord, and there is no other; apart from me there is no God.",
    "a": "Logically and philosophically, an ultimate, maximally great Creator must be singular. You cannot have two infinite, ultimate beings.<br><br><b>Expanded Evidence:</b><ul><li><b>The Logic of Infinity:</b> If there are two 'gods,' they must differ from each other in some way. If they differ, one must lack something the other has. A being that lacks something is not infinite or maximally great. Therefore, there can only be one infinite God.</li><li><b>The Unity of Nature:</b> Ancient polytheists believed different gods controlled different regions (god of the sea, god of the sun), resulting in a chaotic universe. Modern science reveals a unified, deeply cohesive universe governed by universal constants, pointing to a single Architect.</li><li><b>Ockham's Razor:</b> Multiplying causes beyond necessity is mathematically and logically unsound. One infinite, transcendent Mind perfectly and simply accounts for the origin of the universe, fine-tuning, and objective morality without needing to invent a pantheon of finite, competing deities.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.reasonablefaith.org/' target='_blank'>Why Monotheism? (Reasonable Faith)</a></li></ul>"
  },
  {
    "id": "exp-30-jesus-claims",
    "sourceId": "expansion-pack",
    "sourceLabel": "Expansion Pack",
    "sourceShort": "Pack",
    "sourceIndex": 29,
    "legacyNoteKey": "apologetics_exp_note_29",
    "cat": "World Religions",
    "q": "Jesus' Claims: Wasn't Jesus just a great moral teacher like Buddha or Muhammad?",
    "ref": "John 8:58",
    "verse": "'Very truly I tell you,' Jesus answered, 'before Abraham was born, I am!'",
    "a": "C.S. Lewis famously formulated the 'Liar, Lunatic, or Lord' trilemma. A man who claims to be the eternal Creator of the universe cannot be simply passed off as a 'good moral teacher.'<br><br><b>Expanded Evidence:</b><ul><li><b>The Unique Claims:</b> Buddha claimed to point to a path to enlightenment. Muhammad claimed to be a prophet of Allah. Neither claimed to be God. Jesus actively forgave sins committed against God, accepted worship, and applied the sacred name of God (Yahweh / 'I AM') to Himself.</li><li><b>The Trilemma:</b> If Jesus' claims were false, He either knew they were false (making Him a manipulative liar) or He believed they were true (making Him an insane lunatic on the level of a man who thinks he's a poached egg). Neither a liar nor a lunatic can be a 'great moral teacher.'</li><li><b>The Resurrection:</b> The only remaining logical option is that He is exactly who He claimed to be (Lord). He validated this outrageous claim by predicting His own death and bodily rising from the grave three days later.</li></ul><b>Trusted Resources:</b><ul><li><a href='https://www.str.org/w/c.s.-lewis-trilemma' target='_blank'>C.S. Lewis' Trilemma (Stand to Reason)</a></li></ul>"
  }

        entry.cat,
        entry.ref,
        entry.verse,
        entry.answerText,
        entry.sourceLabel,
      ].join(" ").toLowerCase();
    });

    function countForSource(sourceId) {
      if (sourceId === "All") return entries.length;
      return entries.filter((entry) => entry.sourceId === sourceId).length;
    }

    function availableCategories() {
      const base = state.source === "All"
        ? entries
        : entries.filter((entry) => entry.sourceId === state.source);
      return [...new Set(base.map((entry) => entry.cat))].sort((a, b) => a.localeCompare(b));
    }

    function countForCategory(category) {
      return entries.filter((entry) => {
        const sourceMatch = state.source === "All" || entry.sourceId === state.source;
        const categoryMatch = category === "All" || entry.cat === category;
        return sourceMatch && categoryMatch;
      }).length;
    }

    function currentEntries() {
      const query = state.query.trim().toLowerCase();
      return entries.filter((entry) => {
        const sourceMatch = state.source === "All" || entry.sourceId === state.source;
        const categoryMatch = state.category === "All" || entry.cat === state.category;
        const searchMatch = !query || entry.searchText.includes(query);
        return sourceMatch && categoryMatch && searchMatch;
      });
    }

    function makeButton(label, active, onClick, extraClass = "") {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip" + (active ? " active" : "") + (extraClass ? " " + extraClass : "");
      button.innerHTML = label;
      button.addEventListener("click", onClick);
      return button;
    }

    function renderThemeButtons() {
      els.themeButtons.replaceChildren(...themes.map((theme) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "theme-button" + (state.theme === theme.id ? " active" : "");
        button.textContent = theme.label;
        button.addEventListener("click", () => {
          state.theme = theme.id;
          localStorage.setItem("apologetics_library_theme", theme.id);
          applyTheme();
          renderThemeButtons();
        });
        return button;
      }));
    }

    function applyTheme() {
      document.documentElement.dataset.theme = state.theme;
    }

    function renderFilters() {
      const sourceButtons = [
        makeButton("All <span class=\"chip-count\">" + entries.length + "</span>", state.source === "All", () => {
          state.source = "All";
          state.category = "All";
          render();
        }),
        ...sources.map((source) => makeButton(
          source.short + " <span class=\"chip-count\">" + countForSource(source.id) + "</span>",
          state.source === source.id,
          () => {
            state.source = source.id;
            state.category = "All";
            render();
          }
        )),
      ];

      const categoryButtons = [
        makeButton("All <span class=\"chip-count\">" + countForCategory("All") + "</span>", state.category === "All", () => {
          state.category = "All";
          render();
        }),
        ...availableCategories().map((category) => makeButton(
          escapeHtml(category) + " <span class=\"chip-count\">" + countForCategory(category) + "</span>",
          state.category === category,
          () => {
            state.category = category;
            render();
          }
        )),
      ];

      els.sourceFilters.replaceChildren(...sourceButtons);
      els.categoryFilters.replaceChildren(...categoryButtons);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function highlight(value) {
      const safe = escapeHtml(value);
      const query = state.query.trim();
      if (!query) return safe;
      const escapedQuery = query.replace(/[|\\{}()[\]^$+*?.]/g, "\\$&");
      return safe.replace(new RegExp("(" + escapedQuery + ")", "ig"), "<mark>$1</mark>");
    }

    function renderList() {
      const filtered = currentEntries();
      const totalLabel = filtered.length === 1 ? "1 question" : filtered.length + " questions";
      const filterLabel = [
        state.source === "All" ? "all collections" : sources.find((source) => source.id === state.source)?.label,
        state.category === "All" ? "" : state.category,
      ].filter(Boolean).join(" / ");

      els.resultTitle.textContent = totalLabel + " in " + filterLabel;
      els.clearSearch.classList.toggle("visible", Boolean(state.query));

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No questions match those filters.";
        els.list.replaceChildren(empty);
        return;
      }

      els.list.replaceChildren(...filtered.map((entry) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.setAttribute("aria-label", entry.q);
        card.innerHTML =
          "<div class=\"card-meta\">" +
            "<span class=\"pill\">" + escapeHtml(entry.cat) + "</span>" +
            "<span class=\"pill alt\">" + escapeHtml(entry.sourceShort) + "</span>" +
          "</div>" +
          "<h2>" + highlight(entry.q) + "</h2>" +
          "<p class=\"card-ref\">" + highlight(entry.ref) + "</p>" +
          "<p class=\"card-excerpt\">" + highlight(entry.answerText.slice(0, 260)) + "</p>";
        card.addEventListener("click", () => openDetail(entry.id));
        return card;
      }));
    }

    function getNoteKey(entry) {
      return storagePrefix + entry.id;
    }

    function getSavedNote(entry) {
      return localStorage.getItem(getNoteKey(entry)) ?? localStorage.getItem(entry.legacyNoteKey) ?? "";
    }

    function openDetail(id) {
      const entry = entries.find((item) => item.id === id);
      if (!entry) return;

      state.selectedId = id;
      els.detailPanel.classList.remove("empty");
      els.detailPanel.classList.add("open");
      els.body.classList.add("detail-open");
      els.detailMeta.innerHTML =
        "<span class=\"pill\">" + escapeHtml(entry.cat) + "</span>" +
        "<span class=\"pill alt\">" + escapeHtml(entry.sourceLabel) + "</span>";
      els.detailTitle.textContent = entry.q;
      els.detailRef.textContent = entry.ref;
      els.detailVerse.textContent = entry.verse;
      els.detailAnswer.innerHTML = entry.a;
      els.detailAnswer.querySelectorAll("a").forEach((link) => {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      });
      els.notesInput.value = getSavedNote(entry);
      els.saveStatus.textContent = els.notesInput.value ? "Saved" : "";

      if (window.matchMedia("(max-width: 979px)").matches) {
        els.backBtn.focus({ preventScroll: true });
      }
    }

    function closeDetail() {
      els.detailPanel.classList.remove("open");
      els.body.classList.remove("detail-open");
    }

    function currentEntry() {
      return entries.find((entry) => entry.id === state.selectedId);
    }

    function saveNote() {
      const entry = currentEntry();
      if (!entry) return;
      localStorage.setItem(getNoteKey(entry), els.notesInput.value);
      els.saveStatus.textContent = "Saved";
      window.setTimeout(() => {
        if (state.selectedId === entry.id) els.saveStatus.textContent = els.notesInput.value ? "Saved" : "";
      }, 1000);
    }

    function clearNote() {
      const entry = currentEntry();
      if (!entry) return;
      els.notesInput.value = "";
      localStorage.removeItem(getNoteKey(entry));
      els.saveStatus.textContent = "Cleared";
    }

    async function copyReference() {
      const entry = currentEntry();
      if (!entry) return;
      const text = entry.q + "\n" + entry.ref + " - " + entry.verse;
      try {
        await navigator.clipboard.writeText(text);
        els.copyLinkBtn.textContent = "Copied";
      } catch {
        els.copyLinkBtn.textContent = entry.ref;
      }
      window.setTimeout(() => {
        els.copyLinkBtn.textContent = "Copy Ref";
      }, 1200);
    }

    function resetFilters() {
      state.query = "";
      state.source = "All";
      state.category = "All";
      els.search.value = "";
      render();
    }

    function openRandom() {
      const filtered = currentEntries();
      if (!filtered.length) return;
      const entry = filtered[Math.floor(Math.random() * filtered.length)];
      openDetail(entry.id);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    function syncFullscreenLabel() {
      els.fullscreenBtn.textContent = document.fullscreenElement ? "Exit" : "Fullscreen";
    }

    function render() {
      renderFilters();
      renderList();
      els.libraryCount.textContent = entries.length + " answers from " + sources.length + " collections";
    }

    els.search.addEventListener("input", (event) => {
      state.query = event.target.value;
      renderList();
    });

    els.clearSearch.addEventListener("click", () => {
      state.query = "";
      els.search.value = "";
      renderList();
      els.search.focus();
    });

    els.resetFilters.addEventListener("click", resetFilters);
    els.randomBtn.addEventListener("click", openRandom);
    els.fullscreenBtn.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", syncFullscreenLabel);
    els.backBtn.addEventListener("click", closeDetail);
    els.copyLinkBtn.addEventListener("click", copyReference);
    els.saveNoteBtn.addEventListener("click", saveNote);
    els.clearNoteBtn.addEventListener("click", clearNote);
    els.notesInput.addEventListener("input", () => {
      els.saveStatus.textContent = "Unsaved";
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && els.detailPanel.classList.contains("open")) {
        closeDetail();
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        els.search.focus();
      }
    });

    applyTheme();
    renderThemeButtons();
    render();
  </script>
</body>
</html>
